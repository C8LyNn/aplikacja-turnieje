name: CC-001 R17 A70 exact R16 source import
on:
  push:
    branches:
      - feat/cc001-r17-a70-source-import
    paths:
      - "docs/cc001/swarm/r17-import-parts/**"
permissions:
  contents: write
jobs:
  import-r16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A70 only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Node 22 verification runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct and verify the exact R16 source
        run: python3 docs/cc001/swarm/r17_source_import.py
      - name: Validate the imported Unity data
        run: |
          cd unity/cc001-r16/CoreClash-V149-Unity
          node Tools/verify-data.cjs
      - name: Commit only source import and its provenance
        run: |
          git config user.name "cc001-a70-source-import[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- unity/cc001-r16
          git add -A -- docs/cc001/swarm/r17-import-parts docs/cc001/swarm/R17_A70_SOURCE_MANIFEST.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No import changes detected"
            exit 0
          fi
          git commit -m "feat(cc001): import verified V149 R16 Unity source tree"
          git push origin HEAD:refs/heads/feat/cc001-r17-a70-source-import
