name: Neon staging backend readiness

on:
  push:
    branches:
      - codex/neon-staging-backend-readiness
      - codex/neon-http-smoke-isolated-ci
    paths:
      - artifacts/api-server/src/routes/health.ts
      - artifacts/api-server/src/scripts/neon-staging-target.ts
      - artifacts/api-server/src/scripts/neon-staging-api-smoke.ts
      - artifacts/api-server/src/scripts/neon-readonly-api-probe.ts
      - artifacts/api-server/src/scripts/neon-local-http-smoke.ts
      - artifacts/api-server/test/neon-local-http.integration.test.ts
      - artifacts/api-server/test/health.test.ts
      - artifacts/api-server/test/neon-staging-target.test.ts
      - .github/workflows/neon-staging-backend-readiness.yml
  pull_request:
    paths:
      - artifacts/api-server/src/routes/health.ts
      - artifacts/api-server/src/scripts/neon-staging-target.ts
      - artifacts/api-server/src/scripts/neon-staging-api-smoke.ts
      - artifacts/api-server/src/scripts/neon-readonly-api-probe.ts
      - artifacts/api-server/src/scripts/neon-local-http-smoke.ts
      - artifacts/api-server/test/neon-local-http.integration.test.ts
      - artifacts/api-server/test/health.test.ts
      - artifacts/api-server/test/neon-staging-target.test.ts
      - .github/workflows/neon-staging-backend-readiness.yml

permissions:
  contents: read

jobs:
  offline-neon-staging-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Workspace library types
        run: pnpm run typecheck:libs
      - name: Typecheck backend and staging scripts
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Offline health + staging safeguards
        run: pnpm --filter @workspace/api-server exec node --import tsx --test ./test/health.test.ts ./test/neon-staging-target.test.ts

  real-http-disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tournament_readiness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tournament_readiness_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tournament_readiness_test
      TEST_DATABASE_RESET: DROP_TM_TEST_SCHEMA
      TEST_DATABASE_SCHEMA: tm_test_neon_http
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Real GET HTTP smoke with synthetic fixture and read-only PostgreSQL
        run: pnpm --filter @workspace/api-server exec node --import tsx --test --test-concurrency=1 ./test/neon-local-http.integration.test.ts
