name: Neoludology research QA

on:
  push:
    branches:
      - codex/neoludology-research-pipeline-v3
    paths:
      - "artifacts/tournament-manager/src/features/ludology/**"
      - "artifacts/tournament-manager/src/pages/statement-classification.tsx"
      - ".github/workflows/neoludology-research-qa.yml"
  pull_request:
    paths:
      - "artifacts/tournament-manager/src/features/ludology/**"
      - "artifacts/tournament-manager/src/pages/statement-classification.tsx"
      - ".github/workflows/neoludology-research-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neoludology-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Research regression, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Frontend regression
        run: pnpm --filter @workspace/tournament-manager test
      - name: Backend unit regression
        run: pnpm --filter @workspace/api-server test:unit
      - name: Workspace TypeScript
        run: pnpm typecheck
      - name: Frontend production build
        run: pnpm --filter @workspace/tournament-manager build
