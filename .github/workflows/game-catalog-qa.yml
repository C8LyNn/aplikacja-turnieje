name: Game catalog QA

on:
  push:
    branches:
      - codex/game-catalog-editor-reliability
      - codex/game-catalog-featured-discovery
      - codex/game-catalog-steamspy-expansion
      - codex/game-catalog-steamspy-auto-sessions
      - codex/game-catalog-discovery-unified
      - codex/game-catalog-server-keyless-import
      - codex/game-catalog-staging-preflight
      - codex/game-catalog-isolated-staging-smoke
      - codex/game-catalog-resilient-retries
    paths:
      - "artifacts/api-server/**"
      - "artifacts/tournament-manager/**"
      - "lib/game-catalog/**"
      - "lib/db/**"
      - "scripts/preflight-game-catalog-api*.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/game-catalog-qa.yml"
  pull_request:
    branches:
      - codex/game-catalog-editor-reliability
    paths:
      - "artifacts/api-server/**"
      - "artifacts/tournament-manager/**"
      - "lib/game-catalog/**"
      - "lib/db/**"
      - "scripts/preflight-game-catalog-api*.mjs"
      - ".github/workflows/game-catalog-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-catalog-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-postgres:
    name: PostgreSQL catalogue integration
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tm_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tm_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tm_catalog_test
      TEST_DATABASE_SCHEMA: tm_test_catalog
      TEST_DATABASE_RESET: DROP_TM_TEST_SCHEMA
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Catalog integration against PostgreSQL 16
        run: pnpm --filter @workspace/api-server exec node --import tsx --test ./test/steam-catalog.integration.test.ts
      - name: Read-only preflight against disposable PostgreSQL catalog
        run: pnpm --filter @workspace/db test:game-catalog-preflight:integration
      - name: Isolated HTTP staging and verified five-AppID import
        run: pnpm --filter @workspace/api-server exec node --import tsx --test ./test/game-catalog-staging-smoke.integration.test.ts

  catalog-validation:
    name: Frontend and backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend regression tests
        run: pnpm --filter @workspace/tournament-manager test
      - name: Backend unit tests
        run: pnpm --filter @workspace/api-server test:unit
      - name: Read-only catalog preflight regression tests
        run: pnpm --filter @workspace/db test:game-catalog-preflight
      - name: Public API probe regression tests
        run: node --test ./scripts/preflight-game-catalog-api.test.mjs
      - name: Workspace TypeScript
        run: pnpm typecheck
      - name: Production frontend build
        run: pnpm --filter @workspace/tournament-manager build
