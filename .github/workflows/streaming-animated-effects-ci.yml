name: Streaming UI / Animated Effects CI

on:
  pull_request:
    branches:
      - main
      - codex/replit-visual-polish-handoff
    paths:
      - "artifacts/animated-effects/**"
      - "artifacts/tournament-manager/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/streaming-animated-effects-ci.yml"
  push:
    branches:
      - codex/replit-visual-polish-handoff
      - feat/obs-chat-motion-presets-20261011
    paths:
      - "artifacts/animated-effects/**"
      - "artifacts/tournament-manager/**"
      - ".github/workflows/streaming-animated-effects-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: streaming-ui-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-streaming:
    name: Typecheck, tests, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate local Windows preview launcher syntax
        shell: pwsh
        run: |
          $file = "artifacts/animated-effects/scripts/start-local-preview.ps1"
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file).Path, [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "Invalid PowerShell preview launcher syntax."
          }
          if (-not (Test-Path "START_ANIMATED_EFFECTS_PREVIEW.cmd")) {
            throw "Missing Windows preview launcher."
          }

      - name: Animated Effects TypeScript
        run: pnpm --filter animated-effects typecheck

      - name: Build shared TypeScript library references
        run: pnpm run typecheck:libs

      - name: Tournament frontend TypeScript
        run: pnpm --filter @workspace/tournament-manager typecheck

      - name: Tournament frontend tests (including OBS and Animated Effects)
        run: pnpm --filter @workspace/tournament-manager test

      - name: Animated Effects production build
        run: pnpm --filter animated-effects build

      - name: Tournament frontend production build
        run: pnpm --filter @workspace/tournament-manager build

      - name: Check embedded Animated Effects preview route
        run: |
          test -s artifacts/tournament-manager/dist/public/stream/animated-effects/index.html
          test -d artifacts/tournament-manager/dist/public/stream/animated-effects/assets

      - name: Upload isolated Animated Effects preview (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: stream-animated-effects-static-preview
          path: artifacts/tournament-manager/dist/public/stream/animated-effects/
          if-no-files-found: error
          retention-days: 14

      - name: Headless Chromium browser smoke (frontend-only)
        run: node artifacts/animated-effects/scripts/browser-smoke.mjs

      - name: Upload browser QA screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-effects-browser-qa
          path: .cache/animated-effects-browser-qa/
          if-no-files-found: warn
          retention-days: 14

  verify-windows-launcher:
    name: Windows PowerShell 5.1 launcher bootstrap
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js (Windows user version family)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify PowerShell 5.1 launcher can detect Node and pnpm
        shell: powershell
        run: |
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"
          & .\artifacts\animated-effects\scripts\start-local-preview.ps1 -CheckToolsOnly
          if ($LASTEXITCODE -ne 0) {
            throw "PowerShell launcher bootstrap failed."
          }

      - name: Verify double-click CMD launcher delegates successfully
        shell: powershell
        run: |
          & .\START_ANIMATED_EFFECTS_PREVIEW.cmd -CheckToolsOnly
          if ($LASTEXITCODE -ne 0) {
            throw "CMD launcher failed with exit code $LASTEXITCODE."
          }
