        routeId: { type: string }
        sourceStageId: { type: integer }
        sourceBasketId: { type: string }
        targetStageId: { type: integer }
        targetBasketId: { type: string }
        sourceProposalId: { type: integer }
        sourceProposalRevision: { type: integer, minimum: 1 }
        executedAt: { type: string }
        actorType: { type: string }
        actorNick: { type: string }
        routedPlayerCount: { type: integer, minimum: 0 }
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [playerId, sourceFinalRank, sourceBasketPosition, sourceOutputPlayerId]
            properties:
              playerId: { type: integer }
              sourceFinalRank: { type: integer, minimum: 1 }
              sourceBasketPosition: { type: ["integer", "null"] }
              sourceOutputPlayerId: { type: integer }

    BasketRouteStatus:
      type: object
      additionalProperties: false
      required: [routeId, tournamentId, sourceStageId, sourceBasketId, targetStageId, targetBasketId, sourceOutputApproved, materialized, routedPlayerCount, execution]
      properties:
        routeId: { type: string }
        tournamentId: { type: integer }
        sourceStageId: { type: integer }
        sourceBasketId: { type: string }
        targetStageId: { type: integer }
        targetBasketId: { type: string }
        sourceOutputApproved: { type: boolean }
        materialized: { type: boolean }
        routedPlayerCount: { type: integer, minimum: 0 }
        execution:
          oneOf:
            - $ref: "#/components/schemas/BasketRouteExecution"
            - type: "null"

    TargetStageInputArrivals:
      type: object
      additionalProperties: false
      required: [targetStageId, baskets, totalDirectCount, totalRoutedCount, totalCount]
      properties:
        targetStageId: { type: integer }
        totalDirectCount: { type: integer, minimum: 0 }
        totalRoutedCount: { type: integer, minimum: 0 }
        totalCount: { type: integer, minimum: 0 }
        baskets:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [basketId, directPlayers, routedArrivals, directCount, routedCount, totalCount]
            properties:
              basketId: { type: string }
              directCount: { type: integer, minimum: 0 }
              routedCount: { type: integer, minimum: 0 }
              totalCount: { type: integer, minimum: 0 }
              directPlayers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [playerId]
                  properties:
                    playerId: { type: integer }
              routedArrivals:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [playerId, sourceFinalRank, sourceBasketPosition, sourceStageId, sourceBasketId, routeId, sourceProposalId, executionId, arrivedAt]
                  properties:
                    playerId: { type: integer }
                    sourceFinalRank: { type: integer, minimum: 1 }
                    sourceBasketPosition: { type: ["integer", "null"] }
                    sourceStageId: { type: integer }
                    sourceBasketId: { type: string }
                    routeId: { type: string }
                    sourceProposalId: { type: integer }
                    executionId: { type: integer }
                    arrivedAt: { type: string }

    TournamentBackup:
      oneOf:
        - $ref: "#/components/schemas/TournamentBackupV2"
        - $ref: "#/components/schemas/TournamentBackupV3"

    BackupRestoreInput:
      type: object
      additionalProperties: false
      required: [backup, organizerPassword]
      properties:
        backup:
          $ref: "#/components/schemas/TournamentBackup"
        organizerPassword:
          type: string
          minLength: 8
          description: New organizer password. Credentials are never read from the backup.
        viewerPassword:
          type: string
          minLength: 8
          description: New viewer password, required when the restored tournament is private_online.
        supportPassword:
          type: string
          minLength: 8
          description: Optional new support password. When omitted, support access remains disabled.

    ImportResult:
      type: object
      required: [tournament, playersImported, matchesImported, organizerToken]
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        playersImported:
          type: integer
        matchesImported:
          type: integer
        organizerToken:
          type: string
          description: Organizer token scoped to the newly restored tournament.

    TournamentStats:
      type: object
      required: [totalPlayers, totalMatches, completedMatches, pendingMatches, currentRound]
      properties:
        totalPlayers:
          type: integer
        totalMatches:
          type: integer
        completedMatches:
          type: integer
        pendingMatches:
          type: integer
        inProgressMatches:
          type: integer
        currentRound:
          type: ["integer", "null"]
        totalRounds:
          type: ["integer", "null"]
        topPlayers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              matchWins:
                type: integer
              matchLosses:
                type: integer
              gameDiff:
                type: integer
