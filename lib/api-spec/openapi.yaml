openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tournament Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: tournaments
  - name: players
  - name: matches
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List all tournaments
      responses:
        "200":
          description: List of tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a new tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "422":
          description: Stage plan rejected by the domain validator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StagePlanError"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
    patch:
      operationId: updateTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/stages:
    get:
      operationId: listTournamentStages
      tags: [tournaments]
      summary: List the configured stages of a tournament
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          description: Tournament stages in execution order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentStage"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament not found

  /tournaments/{id}/stages/{stageId}:
    get:
      operationId: getTournamentStage
      tags: [tournaments]
      summary: Get a stage with groups, participants, frozen ranking and qualifiers
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Tournament stage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStageDetails"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /tournaments/{id}/stages/{stageId}/qualification-preview:
    get:
      operationId: previewStageQualification
      tags: [tournaments]
      summary: Preview the deterministic ranking and qualification result of an active stage
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Qualification preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageQualificationPreview"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Stage is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"
        "422":
          description: Stage is incomplete or its qualification configuration is inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/stages/{stageId}/readiness:
    get:
      operationId: getTournamentStageReadiness
      tags: [tournaments]
      summary: Check whether a planned stage can be started without modifying it
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Read-only stage start readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageStartReadiness"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/stages/{stageId}/complete:
    post:
      operationId: completeTournamentStage
      tags: [tournaments]
      summary: Atomically complete the active stage and create next-stage participants
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Frozen ranking and qualification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageQualificationPreview"
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Stage lifecycle conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"
        "422":
          description: Stage is incomplete or inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/stages/{stageId}/start:
    post:
      operationId: startTournamentStage
      tags: [tournaments]
      summary: Atomically start the next planned stage and generate its first matches
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Started stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStage"
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Stage lifecycle conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"
        "422":
          description: Stage configuration or participants are inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/start:
    post:
      operationId: startTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}/verify-host-code:
    post:
      operationId: verifyHostCode
      tags: [tournaments]
      summary: Verify the host access code for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyHostCodeInput"
      responses:
        "200":
          description: Code is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyHostCodeResult"
        "403":
          description: Invalid code

  /tournaments/{id}/generate-round:
    post:
      operationId: generateNextRound
      tags: [tournaments]
      summary: Generate next Swiss round
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}/bracket:
    get:
      operationId: getTournamentBracket
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bracket data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bracket"

  /tournaments/{id}/stats:
    get:
      operationId: getTournamentStats
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStats"

  /tournaments/{id}/standings:
    get:
      operationId: getTournamentStandings
      tags: [tournaments]
      summary: Get standings table with Buchholz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"

  /tournaments/{id}/action-log:
    get:
      operationId: getActionLog
      tags: [tournaments]
      summary: Get action log for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionLogEntry"

  /tournaments/{id}/undo-last:
    post:
      operationId: undoLastAction
      tags: [tournaments]
      summary: Undo the last undoable action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action undone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoResult"
        "404":
          description: Nothing to undo
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "409":
          description: The result was already reverted or changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Stored match data is inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /tournaments/{id}/results-history:
    get:
      operationId: getResultsHistory
      tags: [tournaments]
      summary: Get results history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Results history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResultRecord"

  /tournaments/{id}/export:
    get:
      operationId: exportTournament
      tags: [tournaments]
      summary: Export a complete Tournament Stages Backup v3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentBackupV3"
        "404":
          description: Tournament not found

  /tournaments/import:
    post:
      operationId: importTournament
      tags: [tournaments]
      summary: Import Backup v2 or v3 as a new tournament copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentBackup"
      responses:
        "201":
          description: Imported tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid backup file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportError"

  /tournaments/{id}/assistant:
    get:
      operationId: getTournamentAssistant
      tags: [tournaments]
      summary: Get tournament assistant snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assistant snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSnapshot"

  /tournaments/{id}/players:
    get:
      operationId: listPlayers
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: addPlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /tournaments/{id}/players/import:
    post:
      operationId: importPlayers
      tags: [players]
      summary: Import players from CSV text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"

  /players/{id}:
    patch:
      operationId: updatePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/matches:
    get:
      operationId: listMatches
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    patch:
      operationId: updateMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/complete:
    post:
      operationId: completeMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchResult"
      responses:
        "200":
          description: Match completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "409":
          description: Match was already finalized or changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Result payload or current tournament state violates series_v1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /matches/{id}/cancel:
    post:
      operationId: cancelMatch
      tags: [matches]
      summary: Cancel a match (saves state for undo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchCancelInput"
      responses:
        "200":
          description: Match cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "400":
          description: Cannot cancel match in current state

  /matches/{id}/restore-cancelled:
    post:
      operationId: restoreCancelledMatch
      tags: [matches]
      summary: Restore a cancelled match back to pending
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "400":
          description: Match is not cancelled

  /matches/{id}/swap-players:
    post:
      operationId: swapMatchPlayers
      tags: [matches]
      summary: Swap player1 and player2 in a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Players swapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "400":
          description: Cannot swap players in current state

  /tournaments/{id}/reorder-matches:
    post:
      operationId: reorderMatches
      tags: [matches]
      summary: Reorder upcoming matches in the queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderMatchesInput"
      responses:
        "200":
          description: Matches reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}/revert:
    post:
      operationId: revertMatch
      tags: [matches]
      summary: Revert a completed match result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match, tournament, or participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Match is not completed, was already reverted, or downstream blocks the revert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Stored result, participants, history, or finalization is inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

components:
  parameters:
    TournamentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    DomainError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    StageLifecycleError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - TOURNAMENT_NOT_FOUND
            - STAGE_NOT_FOUND
            - STAGE_NOT_ACTIVE
            - STAGE_NOT_NEXT_PLANNED
            - ACTIVE_STAGE_EXISTS
            - PREVIOUS_STAGE_NOT_COMPLETED
            - STAGE_INCOMPLETE
            - STAGE_PARTICIPANTS_INCONSISTENT
            - QUALIFICATION_CONFIGURATION_INVALID
            - STAGE_FORMAT_NOT_SUPPORTED
            - STAGE_ALREADY_COMPLETED
            - STAGE_ALREADY_STARTED
            - MATCHES_ALREADY_EXIST
            - GROUPS_ALREADY_EXIST
            - RANKING_INCONSISTENT
    StageStartReadiness:
      type: object
      required: [ready, reasonCode, message, participantCount, requiredParticipantCount, missingSeeds, blockingMatches, blockingGroups, format]
      properties:
        ready: { type: boolean }
        reasonCode:
          type: string
          enum:
            - READY
            - TOURNAMENT_NOT_FOUND
            - STAGE_NOT_FOUND
            - STAGE_NOT_ACTIVE
            - STAGE_NOT_NEXT_PLANNED
            - ACTIVE_STAGE_EXISTS
            - PREVIOUS_STAGE_NOT_COMPLETED
            - STAGE_INCOMPLETE
            - STAGE_PARTICIPANTS_INCONSISTENT
            - QUALIFICATION_CONFIGURATION_INVALID
            - STAGE_FORMAT_NOT_SUPPORTED
            - STAGE_ALREADY_COMPLETED
            - STAGE_ALREADY_STARTED
            - MATCHES_ALREADY_EXIST
            - GROUPS_ALREADY_EXIST
            - RANKING_INCONSISTENT
        message: { type: string }
        participantCount: { type: integer, minimum: 0 }
        requiredParticipantCount: { type: integer, minimum: 0 }
        missingSeeds:
          type: array
          items: { type: integer, minimum: 1 }
        blockingMatches: { type: integer, minimum: 0 }
        blockingGroups: { type: integer, minimum: 0 }
        format:
          type: string
          enum: [swiss, round_robin, group_stage, single_elimination]
    StagePlanError:
      type: object
      required: [error, code, details]
      properties:
        error: { type: string }
        code: { type: string, const: INVALID_STAGE_PLAN }
        details:
          type: array
          items:
            type: object
            required: [code, path, message]
            properties:
              code: { type: string }
              path: { type: string }
              message: { type: string }
    BackupImportError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [LEGACY_BACKUP_UNSUPPORTED, INVALID_BACKUP, INVALID_BACKUP_V2, INVALID_BACKUP_V3, BACKUP_VERSION_UNSUPPORTED, BACKUP_IMPORT_ROLLED_BACK]
        details:
          type: array
          items: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [ok, unavailable]
      required: [status, database]

    Tournament:
      type: object
      required: [id, name, format, status, resultModelVersion, rankingPolicy, defaultBestOf, createdAt, hasHostCode]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        format:
          type: string
          enum: [single_elimination, round_robin, swiss]
        status:
