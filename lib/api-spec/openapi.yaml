              createdAt: { type: string }
              completedAt: { type: ["string", "null"] }
        marvelGroups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [backupId, stageBackupId, roundBackupId, groupKey, position, status, createdAt]
            properties:
              backupId: { type: integer }
              stageBackupId: { type: integer }
              roundBackupId: { type: integer }
              groupKey: { type: string, minLength: 1 }
              position: { type: integer, minimum: 1 }
              status: { type: string, enum: [pending, completed] }
              completedAt: { type: ["string", "null"] }
              createdAt: { type: string }
        marvelGroupEntries:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [backupId, stageBackupId, roundBackupId, groupBackupId, playerBackupId, groupSlot, createdAt, updatedAt]
            properties:
              backupId: { type: integer }
              stageBackupId: { type: integer }
              roundBackupId: { type: integer }
              groupBackupId: { type: integer }
              playerBackupId: { type: integer }
              sourceGroupBackupId: { type: ["integer", "null"] }
              groupSlot: { type: integer, minimum: 1 }
              placement: { type: ["integer", "null"], minimum: 1 }
              kills: { type: ["integer", "null"], minimum: 0 }
              qualified: { type: ["boolean", "null"] }
              createdAt: { type: string }
              updatedAt: { type: string }
        stageBaskets:
          type: array
          description: Optional explicit stage basket configuration. Its absence preserves legacy one-input/one-output semantics.
          items:
            type: object
            additionalProperties: false
            required: [id, stageBackupId, type, ordinal, order, colorId, participantBackupIds]
            properties:
              id:
                type: string
                pattern: "^[a-z0-9][a-z0-9._:-]{0,99}$"
              stageBackupId: { type: integer }
              type: { type: string, enum: [input, output] }
              ordinal: { type: integer, minimum: 1, maximum: 4 }
              order: { type: integer, minimum: 1, maximum: 4 }
              colorId: { type: ["string", "null"], minLength: 1, maxLength: 64 }
              qualifierCount: { type: ["integer", "null"], minimum: 1 }
              participantBackupIds:
                type: array
                uniqueItems: true
                items: { type: integer }
        stageBasketRoutes:
          type: array
          description: Optional routes between explicit output and input baskets.
          items:
            type: object
            additionalProperties: false
            required: [id, sourceBasketId, targetBasketId]
            properties:
              id:
                type: string
                pattern: "^[a-z0-9][a-z0-9._:-]{0,99}$"
              sourceBasketId: { type: string }
              targetBasketId: { type: string }
        matches:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [backupId, stageBackupId, round, matchNumber, bestOf, status, resultType, resultReason]
            properties:
              backupId: { type: integer }
              stageBackupId: { type: integer }
              stageGroupBackupId: { type: ["integer", "null"] }
              round: { type: integer }
              matchNumber: { type: integer }
              player1BackupId: { type: ["integer", "null"] }
              player2BackupId: { type: ["integer", "null"] }
              winnerBackupId: { type: ["integer", "null"] }
              score1: { type: ["integer", "null"] }
              score2: { type: ["integer", "null"] }
              resultType: { type: ["string", "null"], enum: [played, walkover, bye, no_contest, null] }
              resultReason: { type: ["string", "null"] }
              bestOf: { type: integer }
              status: { type: string, enum: [pending, in_progress, postponed, completed, cancelled] }
              note: { type: ["string", "null"] }
              routingMatchKey: { type: ["string", "null"] }
              nextMatchBackupId: { type: ["integer", "null"] }
              sortOrder: { type: ["integer", "null"] }
              scheduledAt: { type: ["string", "null"] }
              completedAt: { type: ["string", "null"] }
        resultHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [matchBackupId, stageBackupId, revision, round, matchNumber, bestOf, resultType, resultReason, completedAt, recordedAt]
            properties:
              matchBackupId: { type: integer }
              stageBackupId: { type: integer }
              revision: { type: integer }
              round: { type: integer }
              matchNumber: { type: integer }
              player1BackupId: { type: ["integer", "null"] }
              player2BackupId: { type: ["integer", "null"] }
              winnerBackupId: { type: ["integer", "null"] }
              score1: { type: ["integer", "null"] }
              score2: { type: ["integer", "null"] }
              bestOf: { type: integer }
              resultType: { type: string, enum: [played, walkover, bye, no_contest] }
              resultReason: { type: ["string", "null"] }
              completedAt: { type: string }
              recordedAt: { type: string }
        actionLog:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [actionType, description, stageBackupId, matchBackupId, canUndo, undoPayload, isUndone, createdAt]
            properties:
              actionType: { type: string }
              description: { type: string }
              stageBackupId: { type: ["integer", "null"] }
              matchBackupId: { type: ["integer", "null"] }
              canUndo: { type: boolean }
              undoPayload:
                type: ["object", "null"]
                additionalProperties: true
              isUndone: { type: boolean }
              createdAt: { type: string }
        deadlockBans:
          type: array
          description: Per-player Deadlock hero bans (optional, present only for Deadlock tournaments)
          items:
            type: object
            additionalProperties: false
            required: [playerBackupId, bannedHeroIds]
            properties:
              playerBackupId: { type: integer }
              bannedHeroIds:
                type: array
                items: { type: string }
        gamePicks:
          type: array
          description: Per-game hero picks for each match (optional, present only when picks exist)
          items:
            type: object
            additionalProperties: false
            required: [matchBackupId, gameNumber]
            properties:
              matchBackupId: { type: integer }
              gameNumber: { type: integer }
              player1HeroId: { type: ["string", "null"] }
              player2HeroId: { type: ["string", "null"] }
              player1Side:
                type: ["string", "null"]
                enum: [archmother, hidden_king, null]
        routingPlan:
          type: ["object", "null"]
          additionalProperties: true
          description: Optional sealed Tournament Engine V2 routing plan. Required for Double Elimination backups.
        routingExecutions:
          type: array
          description: Mutable Tournament Engine V2 stage snapshots, keyed by the backed-up stage.
          items:
            type: object
            additionalProperties: false
            required: [stageBackupId, revision, state]
            properties:
              stageBackupId: { type: integer }
              revision: { type: integer, minimum: 1 }
              state:
                type: object
                additionalProperties: true
        qualificationProposals:
          type: array
          description: Qualification proposals (one per stage). Present only when the organiser has generated at least one proposal.
          items:
            type: object
            additionalProperties: false
            required: [stageBackupId, revision, status, rankingFingerprint, createdAt, approvedAt, approvedByActorType, approvedByActorNick, entries]
            properties:
              stageBackupId: { type: integer }
              revision: { type: integer, minimum: 1 }
              status: { type: string, enum: [pending, approved] }
              rankingFingerprint: { type: string, minLength: 1 }
              createdAt: { type: string }
              approvedAt: { type: ["string", "null"] }
              approvedByActorType: { type: ["string", "null"] }
              approvedByActorNick: { type: ["string", "null"] }
              entries:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [basketId, playerBackupId, placementRank, basketPosition]
                  properties:
                    basketId: { type: string }
                    playerBackupId: { type: integer }
                    placementRank: { type: integer, minimum: 1 }
                    basketPosition: { type: integer, minimum: 1 }
              output:
                type: array
                description: Materialised output rows — present only for approved proposals.
                items:
                  type: object
                  additionalProperties: false
                  required: [basketId, playerBackupId, finalRank]
                  properties:
                    basketId: { type: string }
                    playerBackupId: { type: integer }
                    finalRank: { type: integer, minimum: 1 }
        routeExecutions:
          type: array
          description: Materialised basket route executions. Present only when at least one route has been executed.
          items:
            type: object
            additionalProperties: false
            required: [routeId, sourceBasketId, targetBasketId, sourceProposalRevision, executedAt, actorType, actorNick, entries]
            properties:
              routeId: { type: string }
              sourceBasketId: { type: string }
              targetBasketId: { type: string }
              sourceProposalRevision: { type: integer, minimum: 1 }
              executedAt: { type: string }
              actorType: { type: string }
              actorNick: { type: string }
              entries:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [playerBackupId, sourceBasketId, sourceFinalRank, sourceBasketPosition]
                  properties:
                    playerBackupId: { type: integer }
                    sourceBasketId: { type: string }
                    sourceFinalRank: { type: integer, minimum: 1 }
                    sourceBasketPosition: { type: ["integer", "null"] }

    BasketRouteExecution:
      type: object
      additionalProperties: false
