    TournamentBackup:
      oneOf:
        - $ref: "#/components/schemas/TournamentBackupV2"
        - $ref: "#/components/schemas/TournamentBackupV3"

    ImportResult:
      type: object
      required: [tournament, playersImported, matchesImported]
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        playersImported:
          type: integer
        matchesImported:
          type: integer

    TournamentStats:
      type: object
      required: [totalPlayers, totalMatches, completedMatches, pendingMatches, currentRound]
      properties:
        totalPlayers:
          type: integer
        totalMatches:
          type: integer
        completedMatches:
          type: integer
        pendingMatches:
          type: integer
        inProgressMatches:
          type: integer
        currentRound:
          type: ["integer", "null"]
        totalRounds:
          type: ["integer", "null"]
        topPlayers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              matchWins:
                type: integer
              matchLosses:
                type: integer
              gameDiff:
                type: integer
