        players:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [backupId, name, status]
            properties:
              backupId: { type: integer }
              name: { type: string }
              rank: { type: ["string", "null"] }
              country: { type: ["string", "null"] }
