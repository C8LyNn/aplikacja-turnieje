    TournamentBackupV3:
      type: object
      additionalProperties: false
      required: [schemaVersion, resultModelVersion, rankingPolicy, exportedAt, tournament, players, stages, groups, stageParticipants, matches, resultHistory, actionLog]
      properties:
        schemaVersion: { type: integer, const: 3 }
