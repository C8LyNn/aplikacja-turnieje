openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tournament Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: tournaments
  - name: players
  - name: matches
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List all tournaments
      responses:
        "200":
          description: List of tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a new tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
    patch:
      operationId: updateTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/start:
    post:
      operationId: startTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}/verify-host-code:
    post:
      operationId: verifyHostCode
      tags: [tournaments]
      summary: Verify the host access code for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyHostCodeInput"
      responses:
        "200":
          description: Code is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyHostCodeResult"
        "403":
          description: Invalid code

  /tournaments/{id}/generate-round:
    post:
      operationId: generateNextRound
      tags: [tournaments]
      summary: Generate next Swiss round
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}/bracket:
    get:
      operationId: getTournamentBracket
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bracket data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bracket"

  /tournaments/{id}/stats:
    get:
      operationId: getTournamentStats
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStats"

  /tournaments/{id}/standings:
    get:
      operationId: getTournamentStandings
      tags: [tournaments]
      summary: Get standings table with Buchholz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"

  /tournaments/{id}/action-log:
    get:
      operationId: getActionLog
      tags: [tournaments]
      summary: Get action log for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionLogEntry"

  /tournaments/{id}/undo-last:
    post:
      operationId: undoLastAction
      tags: [tournaments]
      summary: Undo the last undoable action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Action undone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UndoResult"
        "404":
          description: Nothing to undo
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "409":
          description: The result was already reverted or changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Stored match data is inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /tournaments/{id}/results-history:
    get:
      operationId: getResultsHistory
      tags: [tournaments]
      summary: Get results history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Results history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResultRecord"

  /tournaments/{id}/export:
    get:
      operationId: exportTournament
      tags: [tournaments]
      summary: Export full tournament backup
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentBackup"
        "404":
          description: Tournament not found

  /tournaments/import:
    post:
      operationId: importTournament
      tags: [tournaments]
      summary: Import tournament from backup (creates new copy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentBackup"
      responses:
        "201":
          description: Imported tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid backup file

  /tournaments/{id}/assistant:
    get:
      operationId: getTournamentAssistant
      tags: [tournaments]
      summary: Get tournament assistant snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assistant snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSnapshot"

  /tournaments/{id}/players:
    get:
      operationId: listPlayers
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: addPlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /tournaments/{id}/players/import:
    post:
      operationId: importPlayers
      tags: [players]
      summary: Import players from CSV text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"

  /players/{id}:
    patch:
      operationId: updatePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/matches:
    get:
      operationId: listMatches
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    patch:
      operationId: updateMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/complete:
    post:
      operationId: completeMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchResult"
      responses:
        "200":
          description: Match completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/cancel:
    post:
      operationId: cancelMatch
      tags: [matches]
      summary: Cancel a match (saves state for undo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchCancelInput"
      responses:
        "200":
          description: Match cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "400":
          description: Cannot cancel match in current state

  /matches/{id}/restore-cancelled:
    post:
      operationId: restoreCancelledMatch
      tags: [matches]
      summary: Restore a cancelled match back to pending
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "400":
          description: Match is not cancelled

  /matches/{id}/swap-players:
    post:
      operationId: swapMatchPlayers
      tags: [matches]
      summary: Swap player1 and player2 in a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Players swapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "400":
          description: Cannot swap players in current state

  /tournaments/{id}/reorder-matches:
    post:
      operationId: reorderMatches
      tags: [matches]
      summary: Reorder upcoming matches in the queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderMatchesInput"
      responses:
        "200":
          description: Matches reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}/revert:
    post:
      operationId: revertMatch
      tags: [matches]
      summary: Revert a completed match result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match or required legacy result record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Match is not completed, was already reverted, or downstream blocks the revert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Stored result, participants, statistics, history, or finalization is inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

components:
  schemas:
    DomainError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Tournament:
      type: object
      required: [id, name, format, status, createdAt, hasHostCode]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        format:
          type: string
          enum: [single_elimination, double_elimination, round_robin, swiss]
        status:
          type: string
          enum: [draft, active, completed]
        maxPlayers:
          type: ["integer", "null"]
        swissRounds:
          type: ["integer", "null"]
        allowDraws:
          type: ["boolean", "null"]
        defaultBestOf:
          type: ["integer", "null"]
        currentRound:
          type: ["integer", "null"]
        totalRounds:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        featuredMatchId:
          type: ["integer", "null"]
        hasHostCode:
          type: boolean
          description: Whether a host access code has been set for this tournament
        hasOrganizerPassword:
          type: boolean
          description: Whether an organizer password has been set
        hasSupportPassword:
          type: boolean
          description: Whether a support password has been set
        hasViewerPassword:
          type: boolean
          description: Whether a viewer password has been set (private_online mode)
        visibility:
          type: string
          enum: [public_online, private_online, private_offline]
          description: "public_online=no viewer password; private_online=viewer needs password; private_offline=not listed, org/support only"
        createdAt:
          type: string

    TournamentInput:
      type: object
      required: [name, format]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        format:
          type: string
          enum: [single_elimination, double_elimination, round_robin, swiss]
        maxPlayers:
          type: integer
        swissRounds:
          type: integer
        allowDraws:
          type: boolean
        defaultBestOf:
          type: integer
        organizerPassword:
          type: string
          description: Optional password to protect organizer access
        supportPassword:
          type: string
          description: Optional password for support staff access
        viewerPassword:
          type: string
          description: Optional password for viewer access (required when visibility=private_online)
        visibility:
          type: string
          enum: [public_online, private_online, private_offline]
          description: Tournament visibility mode

    TournamentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        format:
          type: string
          enum: [single_elimination, double_elimination, round_robin, swiss]
        status:
          type: string
          enum: [draft, active, completed]
        maxPlayers:
          type: integer
        swissRounds:
          type: integer
        allowDraws:
          type: boolean
        defaultBestOf:
          type: integer
        featuredMatchId:
          type: integer
        hostCode:
          type: string
          description: Host access code (plain text, stored hashed)
        visibility:
          type: string
          enum: [public_online, private_online, private_offline]
        viewerPassword:
          type: string
          description: New viewer password (clears old viewer sessions)

    VerifyHostCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1

    VerifyHostCodeResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean

    Player:
      type: object
      required: [id, tournamentId, name, createdAt]
      properties:
        id:
          type: integer
        tournamentId:
          type: integer
        name:
          type: string
        rank:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        teamName:
          type: ["string", "null"]
        seed:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, eliminated, winner]
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        points:
          type: integer
        createdAt:
          type: string

    PlayerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        rank:
          type: string
        country:
          type: string
        teamName:
          type: string
        seed:
          type: integer

    PlayerUpdate:
      type: object
      properties:
        name:
          type: string
        rank:
          type: string
        country:
          type: string
        teamName:
          type: string
        seed:
          type: integer
        status:
          type: string
          enum: [active, eliminated, winner]

    CsvImportInput:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
        mode:
          type: string
          enum: [append, replace]
          default: append

    CsvRowError:
      type: object
      required: [line, content, reason]
      properties:
        line:
          type: integer
        content:
          type: string
        reason:
          type: string

    CsvImportResult:
      type: object
      required: [imported, skipped, players, errors]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        replacedCount:
          type: integer
        limitExceeded:
          type: boolean
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/CsvRowError"

    Match:
      type: object
      required: [id, tournamentId, round, matchNumber, status]
      properties:
        id:
          type: integer
        tournamentId:
          type: integer
        round:
          type: integer
        matchNumber:
          type: integer
        player1Id:
          type: ["integer", "null"]
        player2Id:
          type: ["integer", "null"]
        player1Name:
          type: ["string", "null"]
        player2Name:
          type: ["string", "null"]
        score1:
          type: ["integer", "null"]
        score2:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        isDraw:
          type: ["boolean", "null"]
        bestOf:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, ready, in_progress, completed, bye, walkover, postponed, cancelled]
        nextMatchId:
          type: ["integer", "null"]
        sortOrder:
          type: ["integer", "null"]
        scheduledAt:
          type: ["string", "null"]

    MatchCancelInput:
      type: object
      properties:
        note:
          type: string

    ReorderMatchesInput:
      type: object
      required: [matchIds]
      properties:
        matchIds:
          type: array
          items:
            type: integer

    MatchUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending, ready, in_progress, postponed, cancelled]
        note:
          type: string
        bestOf:
          type: integer

    MatchResult:
      type: object
      required: [score1, score2]
      properties:
        winnerId:
          type: [integer, "null"]
        score1:
          type: integer
        score2:
          type: integer
        isDraw:
          type: boolean
        note:
          type: string

    Standing:
      type: object
      required: [rank, playerId, playerName, points, wins, draws, losses, buchholz, pointDiff, seed]
      properties:
        rank:
          type: integer
        playerId:
          type: integer
        playerName:
          type: string
        rank_name:
          type: ["string", "null"]
        teamName:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        seed:
          type: ["integer", "null"]
        points:
          type: integer
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        buchholz:
          type: integer
        pointDiff:
          type: integer
        gamesFor:
          type: integer
        gamesAgainst:
          type: integer

    ResultRecord:
      type: object
      required: [id, matchId, round, matchNumber, player1Name, player2Name, score1, score2, status, completedAt]
      properties:
        id:
          type: integer
        matchId:
          type: integer
        round:
          type: integer
        matchNumber:
          type: integer
        player1Name:
          type: ["string", "null"]
        player2Name:
          type: ["string", "null"]
        score1:
          type: ["integer", "null"]
        score2:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        winnerName:
          type: ["string", "null"]
        isDraw:
          type: ["boolean", "null"]
        status:
          type: string
        completedAt:
          type: string

    ActionLogEntry:
      type: object
      required: [id, tournamentId, actionType, description, canUndo, isUndone, createdAt]
      properties:
        id:
          type: integer
        tournamentId:
          type: integer
        actionType:
          type: string
        description:
          type: string
        matchId:
          type: ["integer", "null"]
        canUndo:
          type: boolean
        isUndone:
          type: boolean
        createdAt:
          type: string

    UndoResult:
      type: object
      required: [action, message]
      properties:
        action:
          $ref: "#/components/schemas/ActionLogEntry"
        message:
          type: string

    AssistantSnapshot:
      type: object
      required: [stepTitle, nextAction]
      properties:
        stepTitle:
          type: string
        nextAction:
          type: string
        warnings:
          type: array
          items:
            type: string

    Bracket:
      type: object
      required: [tournament, rounds]
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/BracketRound"
        winner:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string

    BracketRound:
      type: object
      required: [round, matches]
      properties:
        round:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"

    TournamentBackup:
      type: object
      required: [version, exportedAt, tournament, players, matches, resultHistory, actionLog]
      properties:
        version:
          type: string
        exportedAt:
          type: string
        tournament:
          type: object
          required: [name, format, status]
          properties:
            name:
              type: string
            description:
              type: ["string", "null"]
            format:
              type: string
            status:
              type: string
            maxPlayers:
              type: ["integer", "null"]
            currentRound:
              type: ["integer", "null"]
            totalRounds:
              type: ["integer", "null"]
            swissRounds:
              type: ["integer", "null"]
            featuredMatchId:
              type: ["integer", "null"]
        players:
          type: array
          items:
            type: object
            required: [backupId, name]
            properties:
              backupId:
                type: integer
              name:
                type: string
              rank:
                type: ["string", "null"]
              country:
                type: ["string", "null"]
              teamName:
                type: ["string", "null"]
              seed:
                type: ["integer", "null"]
              wins:
                type: integer
              draws:
                type: integer
              losses:
                type: integer
              points:
                type: integer
              status:
                type: string
        matches:
          type: array
          items:
            type: object
            required: [backupId, round, matchNumber]
            properties:
              backupId:
                type: integer
              round:
                type: integer
              matchNumber:
                type: integer
              player1BackupId:
                type: ["integer", "null"]
              player2BackupId:
                type: ["integer", "null"]
              winnerBackupId:
                type: ["integer", "null"]
              score1:
                type: ["integer", "null"]
              score2:
                type: ["integer", "null"]
              isDraw:
                type: boolean
              bestOf:
                type: integer
              status:
                type: string
              note:
                type: ["string", "null"]
              scheduledAt:
                type: ["string", "null"]
              completedAt:
                type: ["string", "null"]
        resultHistory:
          type: array
          items:
            type: object
            properties:
              round:
                type: integer
              matchNumber:
                type: integer
              player1BackupId:
                type: ["integer", "null"]
              player2BackupId:
                type: ["integer", "null"]
              winnerBackupId:
                type: ["integer", "null"]
              score1:
                type: ["integer", "null"]
              score2:
                type: ["integer", "null"]
              isDraw:
                type: boolean
              status:
                type: string
        actionLog:
          type: array
          items:
            type: object
            properties:
              actionType:
                type: string
              description:
                type: string
              matchBackupId:
                type: ["integer", "null"]
              isUndone:
                type: boolean
              createdAt:
                type: string

    ImportResult:
      type: object
      required: [tournament, playersImported, matchesImported]
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        playersImported:
          type: integer
        matchesImported:
          type: integer

    TournamentStats:
      type: object
      required: [totalPlayers, totalMatches, completedMatches, pendingMatches, currentRound]
      properties:
        totalPlayers:
          type: integer
        totalMatches:
          type: integer
        completedMatches:
          type: integer
        pendingMatches:
          type: integer
        inProgressMatches:
          type: integer
        currentRound:
          type: ["integer", "null"]
        totalRounds:
          type: ["integer", "null"]
        topPlayers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              wins:
                type: integer
              losses:
                type: integer
              points:
                type: integer
