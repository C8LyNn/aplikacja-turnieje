              note: { type: ["string", "null"] }
              nextMatchBackupId: { type: ["integer", "null"] }
              sortOrder: { type: ["integer", "null"] }
              scheduledAt: { type: ["string", "null"] }
              completedAt: { type: ["string", "null"] }
        resultHistory:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [matchBackupId, stageBackupId, revision, round, matchNumber, bestOf, resultType, resultReason, completedAt, recordedAt]
            properties:
