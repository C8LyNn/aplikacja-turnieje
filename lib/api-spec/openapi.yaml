    ResultCorrectionStandingsComparison:
      description: Hypothetical projection; neither an authorization nor official rankings.
      oneOf:
        - type: object
          required: [status, reasonCode, message]
          properties:
            status: { type: string, const: unavailable }
            reasonCode: { type: string }
            message: { type: string }
        - type: object
          required: [status, stageId, stageName, stageFormat, scope, scopeLabel, provisional, note, diff]
          properties:
            status: { type: string, const: available }
            stageId: { type: integer }
            stageName: { type: string }
            stageFormat: { type: string, enum: [swiss, round_robin, group_stage] }
            scope: { type: string, enum: [stage, group] }
            scopeLabel: { type: string }
            provisional: { type: boolean, const: true }
            note: { type: string }
            diff:
              type: object
              required: [rows, changedRows, movedRows, qualifierImpact]
              properties:
                changedRows: { type: integer, minimum: 0 }
                movedRows: { type: integer, minimum: 0 }
                rows:
                  type: array
                  items:
                    type: object
                    required: [playerId, playerName, beforeRank, afterRank, rankDelta, beforeMatchWins, afterMatchWins, beforeGameDiff, afterGameDiff, beforeBuchholz, afterBuchholz, changed]
                    properties:
                      playerId: { type: integer }
                      playerName: { type: string }
                      beforeRank: { type: integer }
                      afterRank: { type: integer }
                      rankDelta: { type: integer }
                      beforeMatchWins: { type: integer }
                      afterMatchWins: { type: integer }
                      beforeGameDiff: { type: integer }
                      afterGameDiff: { type: integer }
                      beforeBuchholz: { type: [integer, "null"] }
                      afterBuchholz: { type: [integer, "null"] }
                      changed: { type: boolean }
                qualifierImpact:
                  type: object
                  required: [status, cutoff, beforePlayerIds, afterPlayerIds, gainingPlayerIds, losingPlayerIds]
                  properties:
                    status: { type: string, enum: [projected, not_applicable] }
                    cutoff: { type: [integer, "null"] }
                    beforePlayerIds: { type: array, items: { type: integer } }
                    afterPlayerIds: { type: array, items: { type: integer } }
                    gainingPlayerIds: { type: array, items: { type: integer } }
                    losingPlayerIds: { type: array, items: { type: integer } }

    EliminationBracketImpact:
      description: Structural-only hypothetical SE dependency chain; never operation authorization.
      oneOf:
        - type: object
          required: [status, reasonCode, message]
          properties:
            status: { type: string, const: unavailable }
            reasonCode: { type: string }
            message: { type: string }
        - type: object
          required: [status, stageId, stageName, format, provisional, forecastScope, winnerChanges, sourceMatch, directSlot, possibleDownstream, issues, chainComplete, finalRoundWinnerMayChange, note]
          properties:
            status: { type: string, const: available }
            stageId: { type: integer }
            stageName: { type: string }
            format: { type: string, const: single_elimination }
            provisional: { type: boolean, const: true }
            forecastScope: { type: string, const: structure_only }
            winnerChanges: { type: boolean }
            sourceMatch:
              type: object
              required: [matchId, round, matchNumber]
              properties:
                matchId: { type: integer }
                round: { type: integer }
                matchNumber: { type: integer }
            directSlot:
              type: [object, "null"]
              required: [matchId, round, slot, currentPlayerId, hypotheticalPlayerId, matchingCurrentWinner, pristine]
              properties:
                matchId: { type: integer }
                round: { type: integer }
                slot: { type: string, enum: [player1, player2] }
                currentPlayerId: { type: [integer, "null"] }
                hypotheticalPlayerId: { type: integer }
                matchingCurrentWinner: { type: boolean }
                pristine: { type: boolean }
            possibleDownstream:
              type: array
              items:
                type: object
                required: [matchId, round, matchNumber, status, relation, blocking]
                properties:
                  matchId: { type: integer }
                  round: { type: integer }
                  matchNumber: { type: integer }
                  status: { type: string }
                  relation: { type: string, enum: [direct_slot, possible_later_match] }
                  blocking: { type: boolean }
            issues:
              type: array
              items:
                type: object
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
            chainComplete: { type: boolean }
            finalRoundWinnerMayChange: { type: boolean }
            note: { type: string }

    PreviewReadGuard:
      description: Best-effort second read of all stage matches; NOT serializable transaction or execution permission.
      type: object
      required: [status, stageId, stageVersionVector]
      properties:
        status: { type: string, enum: [stable_on_recheck, changed_during_read] }
        stageId: { type: integer }
        stageVersionVector: { type: string }

    DoubleEliminationRoutingImpact:
      description: Hypothetical read-only DE routing-v2 evaluation; no mutation permission.
      oneOf:
        - type: object
          required: [status, reasonCode, message]
          properties:
            status: { type: string, const: unavailable }
            reasonCode: { type: string }
            message: { type: string }
        - type: object
          required: [status, provisional, scope, stageId, sourceMatchKey, winnerChanges, currentWinnerId, proposedWinnerId, planRevision, executionRevision, upstreamRoutes, affectedMatches, invalidatedDecisions, currentChampionId, hypotheticalChampionId, warningCodes, note]
          properties:
            status: { type: string, const: available }
            provisional: { type: boolean, const: true }
            scope: { type: string, const: double_elimination_routing_v2 }
            stageId: { type: integer }
            sourceMatchKey: { type: string }
            winnerChanges: { type: boolean }
            currentWinnerId: { type: integer }
            proposedWinnerId: { type: integer }
            planRevision: { type: integer }
            executionRevision: { type: integer }
            upstreamRoutes:
              type: array
              items:
                type: object
                required: [routeKey, outcome, targetMatchKey, targetSlot]
                properties:
                  routeKey: { type: string }
                  outcome: { type: string, enum: [winner, loser] }
                  targetMatchKey: { type: string }
                  targetSlot: { type: integer, enum: [1, 2] }
            affectedMatches:
              type: array
              items:
                type: object
                required: [matchKey, label, currentStatus, hypotheticalStatus, currentSlots, hypotheticalSlots, existingCanonicalMatchId, canonicalMatchAlreadyCompleted]
                properties:
                  matchKey: { type: string }
                  label: { type: string }
                  currentStatus: { type: string }
                  hypotheticalStatus: { type: string }
                  currentSlots: { type: array, minItems: 2, maxItems: 2, items: { type: [string, "null"] } }
                  hypotheticalSlots: { type: array, minItems: 2, maxItems: 2, items: { type: [string, "null"] } }
                  existingCanonicalMatchId: { type: [integer, "null"] }
                  canonicalMatchAlreadyCompleted: { type: boolean }
            invalidatedDecisions:
              type: array
              items:
                type: object
                required: [matchKey, canonicalMatchId, canonicalMatchAlreadyCompleted]
                properties:
                  matchKey: { type: string }
                  canonicalMatchId: { type: [integer, "null"] }
                  canonicalMatchAlreadyCompleted: { type: boolean }
            currentChampionId: { type: [integer, "null"] }
            hypotheticalChampionId: { type: [integer, "null"] }
            warningCodes: { type: array, items: { type: string } }
            note: { type: string }

    CorrectionRecoveryPlan:
      description: Read-only non-executable, organizer-review-only plan for correction recovery. Not a permission or workflow trigger.
      type: object
      required: [version, kind, advisory, mutationPerformed, executable, permissionToExecute, status, risk, matchId, expectedRevision, proposedScore, evidence, affected, blockerCodes, approvalQuestions, steps, note]
      properties:
        version: { type: integer, const: 1 }
        kind: { type: string, const: correction_recovery_playbook }
        advisory: { type: boolean, const: true }
        mutationPerformed: { type: boolean, const: false }
        executable: { type: boolean, const: false }
        permissionToExecute: { type: boolean, const: false }
        status: { type: string, enum: [stale, blocked, no_change, manual_review] }
