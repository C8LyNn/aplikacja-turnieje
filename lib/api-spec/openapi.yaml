              status: { type: string, enum: [planned, active, completed] }
              participantCount: { type: integer }
              bestOf: { type: integer }
              plannedRounds: { type: ["integer", "null"] }
              currentRound: { type: ["integer", "null"] }
              totalRounds: { type: ["integer", "null"] }
              rankingPolicy: { type: string, enum: [swiss_v1, round_robin_v1, group_v1, elimination_bracket_v1] }
              qualificationMode: { type: string, enum: [none, top_n, top_n_per_group] }
              advancingCount: { type: ["integer", "null"] }
              groupCount: { type: ["integer", "null"] }
              participantsPerGroup: { type: ["integer", "null"] }
              qualifiersPerGroup: { type: ["integer", "null"] }
              seedingPolicy: { type: string, enum: [standings_order, snake_groups, cross_group, random_groups, standard_bracket, random_bracket] }
              entrySeedingPolicy: { type: string, enum: [preserve, registration_order, alphabetical, random, manual] }
              resultSeedingPolicy: { type: string, enum: [standings_order, rank_bands, global_ranking] }
              randomSeed: { type: ["string", "null"] }
              randomRevealOrder: { type: string, enum: [instant, sequential] }
              seedingAudit:
                type: ["object", "null"]
                additionalProperties: true
              winnerBackupId: { type: ["integer", "null"] }
              version: { type: integer }
              createdAt: { type: string }
              startedAt: { type: ["string", "null"] }
              completedAt: { type: ["string", "null"] }
        groups:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [backupId, stageBackupId, groupKey, position, participantCount, qualifiersCount, createdAt]
            properties:
              backupId: { type: integer }
              stageBackupId: { type: integer }
              groupKey: { type: string, minLength: 1 }
              position: { type: integer }
              participantCount: { type: integer }
              qualifiersCount: { type: integer }
              createdAt: { type: string }
        stageParticipants:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [backupId, stageBackupId, playerBackupId, stageSeed, status, qualificationSource, createdAt]
            properties:
              backupId: { type: integer }
              stageBackupId: { type: integer }
              playerBackupId: { type: integer }
              stageSeed: { type: integer }
              groupBackupId: { type: ["integer", "null"] }
              status: { type: string, enum: [active, eliminated, qualified, winner] }
              qualificationSource: { type: string, enum: [registration, standings, group_position] }
              finalRank: { type: ["integer", "null"] }
              groupRank: { type: ["integer", "null"] }
              qualificationRank: { type: ["integer", "null"] }
              nextStageSeed: { type: ["integer", "null"] }
              sourceStageParticipantBackupId: { type: ["integer", "null"] }
              qualifiedAt: { type: ["string", "null"] }
              createdAt: { type: string }
        marvelRounds:
          type: array
