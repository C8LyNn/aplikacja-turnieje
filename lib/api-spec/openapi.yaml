openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tournament Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: tournaments
  - name: players
  - name: matches
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List all tournaments
      responses:
        "200":
          description: List of tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a new tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
    patch:
      operationId: updateTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/start:
    post:
      operationId: startTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}/generate-round:
    post:
      operationId: generateNextRound
      tags: [tournaments]
      summary: Generate next Swiss round
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Round generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}/bracket:
    get:
      operationId: getTournamentBracket
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Bracket data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bracket"

  /tournaments/{id}/stats:
    get:
      operationId: getTournamentStats
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStats"

  /tournaments/{id}/standings:
    get:
      operationId: getTournamentStandings
      tags: [tournaments]
      summary: Get standings table with Buchholz
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Standing"

  /tournaments/{id}/results-history:
    get:
      operationId: getResultsHistory
      tags: [tournaments]
      summary: Get results history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Results history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResultRecord"

  /tournaments/{id}/assistant:
    get:
      operationId: getTournamentAssistant
      tags: [tournaments]
      summary: Get tournament assistant snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assistant snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSnapshot"

  /tournaments/{id}/players:
    get:
      operationId: listPlayers
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: addPlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /tournaments/{id}/players/import:
    post:
      operationId: importPlayers
      tags: [players]
      summary: Import players from CSV text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"

  /players/{id}:
    patch:
      operationId: updatePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/matches:
    get:
      operationId: listMatches
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    patch:
      operationId: updateMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/complete:
    post:
      operationId: completeMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchResult"
      responses:
        "200":
          description: Match completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/revert:
    post:
      operationId: revertMatch
      tags: [matches]
      summary: Revert a completed match result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Tournament:
      type: object
      required: [id, name, format, status, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        format:
          type: string
          enum: [single_elimination, double_elimination, round_robin, swiss]
        status:
          type: string
          enum: [draft, active, completed]
        maxPlayers:
          type: ["integer", "null"]
        swissRounds:
          type: ["integer", "null"]
        allowDraws:
          type: ["boolean", "null"]
        defaultBestOf:
          type: ["integer", "null"]
        currentRound:
          type: ["integer", "null"]
        totalRounds:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        featuredMatchId:
          type: ["integer", "null"]
        createdAt:
          type: string

    TournamentInput:
      type: object
      required: [name, format]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        format:
          type: string
          enum: [single_elimination, double_elimination, round_robin, swiss]
        maxPlayers:
          type: integer
        swissRounds:
          type: integer
        allowDraws:
          type: boolean
        defaultBestOf:
          type: integer

    TournamentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        format:
          type: string
          enum: [single_elimination, double_elimination, round_robin, swiss]
        status:
          type: string
          enum: [draft, active, completed]
        maxPlayers:
          type: integer
        swissRounds:
          type: integer
        allowDraws:
          type: boolean
        defaultBestOf:
          type: integer
        featuredMatchId:
          type: integer

    Player:
      type: object
      required: [id, tournamentId, name, createdAt]
      properties:
        id:
          type: integer
        tournamentId:
          type: integer
        name:
          type: string
        rank:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        teamName:
          type: ["string", "null"]
        seed:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, eliminated, winner]
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        points:
          type: integer
        createdAt:
          type: string

    PlayerInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        rank:
          type: string
        country:
          type: string
        teamName:
          type: string
        seed:
          type: integer

    PlayerUpdate:
      type: object
      properties:
        name:
          type: string
        rank:
          type: string
        country:
          type: string
        teamName:
          type: string
        seed:
          type: integer
        status:
          type: string
          enum: [active, eliminated, winner]

    CsvImportInput:
      type: object
      required: [csv]
      properties:
        csv:
          type: string

    CsvImportResult:
      type: object
      required: [imported, skipped, players]
      properties:
        imported:
          type: integer
        skipped:
          type: integer
        players:
          type: array
          items:
            $ref: "#/components/schemas/Player"

    Match:
      type: object
      required: [id, tournamentId, round, matchNumber, status]
      properties:
        id:
          type: integer
        tournamentId:
          type: integer
        round:
          type: integer
        matchNumber:
          type: integer
        player1Id:
          type: ["integer", "null"]
        player2Id:
          type: ["integer", "null"]
        player1Name:
          type: ["string", "null"]
        player2Name:
          type: ["string", "null"]
        score1:
          type: ["integer", "null"]
        score2:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        isDraw:
          type: ["boolean", "null"]
        bestOf:
          type: ["integer", "null"]
        note:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, ready, in_progress, completed, bye, walkover]
        nextMatchId:
          type: ["integer", "null"]
        scheduledAt:
          type: ["string", "null"]

    MatchUpdate:
      type: object
      properties:
        score1:
          type: integer
        score2:
          type: integer
        status:
          type: string
          enum: [pending, ready, in_progress, completed, bye, walkover]
        note:
          type: string
        bestOf:
          type: integer

    MatchResult:
      type: object
      required: [score1, score2]
      properties:
        winnerId:
          type: integer
        score1:
          type: integer
        score2:
          type: integer
        isDraw:
          type: boolean
        note:
          type: string

    Standing:
      type: object
      required: [rank, playerId, playerName, points, wins, draws, losses, buchholz, pointDiff, seed]
      properties:
        rank:
          type: integer
        playerId:
          type: integer
        playerName:
          type: string
        rank_name:
          type: ["string", "null"]
        teamName:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        seed:
          type: ["integer", "null"]
        points:
          type: integer
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
        buchholz:
          type: integer
        pointDiff:
          type: integer
        gamesFor:
          type: integer
        gamesAgainst:
          type: integer

    ResultRecord:
      type: object
      required: [id, matchId, round, matchNumber, player1Name, player2Name, score1, score2, status, completedAt]
      properties:
        id:
          type: integer
        matchId:
          type: integer
        round:
          type: integer
        matchNumber:
          type: integer
        player1Name:
          type: ["string", "null"]
        player2Name:
          type: ["string", "null"]
        score1:
          type: ["integer", "null"]
        score2:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        winnerName:
          type: ["string", "null"]
        isDraw:
          type: ["boolean", "null"]
        status:
          type: string
        completedAt:
          type: string

    AssistantSnapshot:
      type: object
      required: [stepTitle, nextAction]
      properties:
        stepTitle:
          type: string
        nextAction:
          type: string
        warnings:
          type: array
          items:
            type: string

    Bracket:
      type: object
      required: [tournament, rounds]
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        rounds:
          type: array
          items:
            $ref: "#/components/schemas/BracketRound"
        winner:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string

    BracketRound:
      type: object
      required: [round, matches]
      properties:
        round:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"

    TournamentStats:
      type: object
      required: [totalPlayers, totalMatches, completedMatches, pendingMatches, currentRound]
      properties:
        totalPlayers:
          type: integer
        totalMatches:
          type: integer
        completedMatches:
          type: integer
        pendingMatches:
          type: integer
        inProgressMatches:
          type: integer
        currentRound:
          type: ["integer", "null"]
        totalRounds:
          type: ["integer", "null"]
        topPlayers:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              wins:
                type: integer
              losses:
                type: integer
              points:
                type: integer
