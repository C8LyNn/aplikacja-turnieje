            possibleAffectedLogicalMatches: { type: integer }
            potentiallyInvalidatedCompletedResults: { type: integer }
        blockerCodes: { type: array, items: { type: string } }
        approvalQuestions: { type: array, items: { type: string } }
        steps:
          type: array
          items:
            type: object
            required: [id, phase, title, instruction, requiresOrganizerApproval, mutation, automaticExecutionAllowed, dependsOn]
