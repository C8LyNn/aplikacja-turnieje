openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Tournament Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: tournaments
  - name: players
  - name: matches
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List all tournaments
      responses:
        "200":
          description: List of tournaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tournament"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a new tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentCreationResponse"
        "400":
          description: Tournament input or organizer password is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTournamentBadRequestError"
        "422":
          description: Tournament rule or stage plan rejected the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTournamentUnprocessableError"

  /tournaments/plan-preview:
    post:
      operationId: previewTournamentPlan
      tags: [tournaments]
      summary: Preview a validated tournament template without creating anything
      description: Public read-only plan generation. Returned plan must be revalidated at creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentTemplateRequest"
      responses:
        "200":
          description: Validated tournament plan preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentTemplatePreview"
        "422":
          description: Unsupported template or participant count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentTemplateFailure"

  /tournaments/{id}/operations/result-correction-preview:
    post:
      operationId: previewTournamentResultCorrection
      tags: [tournaments]
      summary: Advisory, read-only score correction impact preview
      description: >-
        Does not modify any matches or authorize a correction. Requires organizer/support.
        The actual revert and re-complete operations must recheck the database transactionally.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, expectedRevision, proposedScore1, proposedScore2]
              additionalProperties: false
              properties:
                matchId: { type: integer, minimum: 1 }
                expectedRevision: { type: integer, minimum: 0 }
                proposedScore1: { type: integer, minimum: 0 }
                proposedScore2: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Advisory only; never an authorization or guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResultCorrectionImpactPreview" }
        "400": { description: Invalid request }
        "403": { description: Organizer or support authorization required }
        "404": { description: Match/tournament not found }

  /tournaments/{id}/operations/qualification-routing-preview:
    get:
      operationId: getTournamentQualificationRoutingPreview
      tags: [tournaments]
      summary: Read-only organizer/support status of qualification proposals and basket routing
      description: Advisory snapshot only; it does not approve proposals, execute routes or authorize mutations.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Advisory qualification and routing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationRoutingPreview"
        "400":
          description: Invalid tournament id
        "403":
          description: Organizer or support authentication required
        "404":
          description: Tournament not found

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
    patch:
      operationId: updateTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TournamentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "400":
          description: Invalid tournament or game configuration
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/SimpleError"
                  - $ref: "#/components/schemas/TournamentGameConfigError"
        "403":
          description: Organizer authorization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Game configuration is immutable after tournament start
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameConfigImmutableError"
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/stages:
    get:
      operationId: listTournamentStages
      tags: [tournaments]
      summary: List the configured stages of a tournament
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          description: Tournament stages in execution order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentStage"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament not found

  /tournaments/{id}/stage-baskets:
    get:
      operationId: getTournamentStageBaskets
      tags: [tournaments]
      summary: Read stable stage input/output baskets, routes and validation state
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      responses:
        "200":
          description: Stage basket configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageBasketConfiguration"
        "400":
          description: Invalid tournament id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageBasketConfigurationError" }
    put:
      operationId: updateTournamentStageBaskets
      tags: [tournaments]
      summary: Atomically replace the editable stage basket graph before tournament start
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageBasketConfigurationInput"
      responses:
        "200":
          description: Updated stage basket configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageBasketConfiguration"
        "400":
          description: Invalid tournament id or basket request body
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageBasketConfigurationError" }
        "409":
          description: Configuration is immutable or a stable id was reassigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageBasketConfigurationError" }
        "422":
          description: Basket graph is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StageBasketConfigurationError" }

  /tournaments/{id}/stages/{stageId}:
    get:
      operationId: getTournamentStage
      tags: [tournaments]
      summary: Get a stage with groups, participants, frozen ranking and qualifiers
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Tournament stage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStageDetails"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /tournaments/{id}/stages/{stageId}/seeding-ceremony:
    get:
      operationId: getStageSeedingCeremony
      tags: [tournaments]
      summary: Read the persisted pre-stage seeding ceremony
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Current ceremony or null when it has not been prepared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeedingCeremonyResponse"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
    delete:
      operationId: resetStageSeedingCeremony
      tags: [tournaments]
      summary: Reset a prepared ceremony before the stage starts
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "204": { description: Ceremony reset }
        "403":
          description: Organizer access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "409":
          description: Stage is no longer planned or the ceremony is stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "422":
          description: Random ceremony is unavailable or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }

  /tournaments/{id}/stages/{stageId}/seeding-ceremony/prepare:
    post:
      operationId: prepareStageSeedingCeremony
      tags: [tournaments]
      summary: Persist every deterministic draw before revealing it
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Prepared ceremony
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyResponse" }
        "403":
          description: Organizer access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "409":
          description: Stage cannot be prepared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "422":
          description: Random ceremony is unavailable or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }

  /tournaments/{id}/stages/{stageId}/seeding-ceremony/reveal-next:
    post:
      operationId: revealNextStageSeedingDraw
      tags: [tournaments]
      summary: Reveal exactly one previously persisted draw
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Updated ceremony
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyResponse" }
        "403":
          description: Organizer access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "409":
          description: Ceremony is unavailable, stale or already complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "422":
          description: Random ceremony is unavailable or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }

  /tournaments/{id}/stages/{stageId}/seeding-ceremony/reveal-all:
    post:
      operationId: revealAllStageSeedingDraws
      tags: [tournaments]
      summary: Reveal every remaining persisted draw without animation
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Completed ceremony
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyResponse" }
        "403":
          description: Organizer access required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "409":
          description: Ceremony is unavailable, stale or already complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }
        "422":
          description: Random ceremony is unavailable or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeedingCeremonyError" }

  /tournaments/{id}/stages/{stageId}/qualification-preview:
    get:
      operationId: previewStageQualification
      tags: [tournaments]
      summary: Preview the deterministic ranking and qualification result of an active stage
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Qualification preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageQualificationPreview"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Stage is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"
        "422":
          description: Stage is incomplete or its qualification configuration is inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/stages/{stageId}/basket-qualification-proposal:
    post:
      operationId: generateBasketQualificationProposal
      tags: [tournaments]
      summary: Generate or refresh a pending qualification proposal for a stage's output baskets
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Pending qualification proposal with ranked entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationProposal"
        "400":
          description: Invalid id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SimpleError" }
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "409":
          description: Format not supported, config not explicit, or already approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "422":
          description: Tie-break required at basket boundary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
    get:
      operationId: getBasketQualificationProposal
      tags: [tournaments]
      summary: Read the current qualification proposal (pending or approved) for a stage
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Current qualification proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationProposal"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament, stage, or proposal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }

  /tournaments/{id}/stages/{stageId}/basket-qualification-proposal/approve:
    post:
      operationId: approveBasketQualificationProposal
      tags: [tournaments]
      summary: Approve a pending proposal and materialise output basket players (idempotent)
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Approved proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationProposal"
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament, stage, or proposal not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "409":
          description: Ranking fingerprint is stale — re-generate before approving
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }

  /tournaments/{id}/stages/{stageId}/basket-qualification-output:
    get:
      operationId: getBasketQualificationOutput
      tags: [tournaments]
      summary: Read materialised output basket players for a stage (empty before approval)
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Materialised output basket players
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualificationOutput"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }

  /tournaments/{id}/stages/{stageId}/baskets/{basketId}/route/execute:
    post:
      operationId: executeBasketRoute
      tags: [tournaments]
      summary: Materialise a configured basket route — copy approved output players to the target stage input basket
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
        - name: basketId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Route execution result (idempotent — returns existing if already materialised)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasketRouteExecution"
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament, stage, or route not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "409":
          description: Precondition not met (source not approved, target stage started, participant conflict, etc.)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }

  /tournaments/{id}/stages/{stageId}/baskets/{basketId}/route:
    get:
      operationId: getBasketRouteStatus
      tags: [tournaments]
      summary: Read the configured route and execution status for a source basket
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
        - name: basketId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Route configuration and execution state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasketRouteStatus"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament, stage, or route not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }

  /tournaments/{id}/stages/{stageId}/basket-input-arrivals:
    get:
      operationId: getBasketInputArrivals
      tags: [tournaments]
      summary: Read aggregated input basket arrivals for a target stage (direct assignments + routed arrivals)
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Aggregated input basket arrivals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TargetStageInputArrivals"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DomainError" }

  /tournaments/{id}/stages/{stageId}/readiness:
    get:
      operationId: getTournamentStageReadiness
      tags: [tournaments]
      summary: Check whether a planned stage can be started without modifying it
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Read-only stage start readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageStartReadiness"
        "403":
          description: Tournament is not visible to the current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/stages/{stageId}/complete:
    post:
      operationId: completeTournamentStage
      tags: [tournaments]
      summary: Atomically complete the active stage and create next-stage participants
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Frozen ranking and qualification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageQualificationPreview"
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Stage lifecycle conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"
        "422":
          description: Stage is incomplete or inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/stages/{stageId}/start:
    post:
      operationId: startTournamentStage
      tags: [tournaments]
      summary: Atomically start the next planned stage and generate its first matches
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: Started stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentStage"
        "403":
          description: Organizer authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "404":
          description: Tournament or stage not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Stage lifecycle conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"
        "422":
          description: Stage configuration or participants are inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageLifecycleError"

  /tournaments/{id}/stages/{stageId}/double-elimination:
    get:
      operationId: getDoubleEliminationStage
      tags: [tournaments]
      summary: Read the authoritative Double Elimination bracket execution
      parameters:
