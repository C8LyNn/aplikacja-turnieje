          items:
            type: object
            additionalProperties: false
            required: [backupId, stageBackupId, roundNumber, participantCount, groupSize, advancingCount, killLimit, regroupingStrategy, status, createdAt]
            properties:
              backupId: { type: integer }
              stageBackupId: { type: integer }
              roundNumber: { type: integer, minimum: 1 }
