                    reason: { type: string }

    TournamentProgressionPreflight:
      type: object
      description: Read-only progression guidance; not an execution authorization.
      required: [version, advisory, tournamentId, kind, availability, stageId, stageName, title, description, checks, effects, blockers, requiresConfirmation, executionMustRevalidate]
      properties:
        version: { type: integer, enum: [1] }
        advisory: { type: boolean, const: true }
        tournamentId: { type: integer }
        kind: { type: string, enum: [start_stage, complete_stage, swiss_next_round, review, none] }
        availability: { type: string, enum: [ready_for_review, blocked, not_applicable] }
        stageId: { type: [integer, "null"] }
        stageName: { type: [string, "null"] }
        title: { type: string }
        description: { type: string }
        blockers: { type: integer, minimum: 0 }
        requiresConfirmation: { type: boolean }
        executionMustRevalidate: { type: boolean, const: true }
        checks:
          type: array
          items:
            type: object
            required: [code, status, message]
            properties:
              code: { type: string }
              status: { type: string, enum: [pass, block, review] }
              message: { type: string }
        effects:
          type: array
          items:
            type: object
            required: [code, confidence, message]
            properties:
              code: { type: string }
              confidence: { type: string, enum: [derived, conditional] }
              message: { type: string }

    TournamentOperationsSnapshot:
      type: object
      description: Advisory, read-only guidance. Mutation endpoints remain authoritative.
      required: [version, tournamentId, phase, currentStageId, progress, recommendedAction, blockers, advisory]
      properties:
        version:
          type: integer
          enum: [1]
        tournamentId:
          type: integer
        phase:
          type: string
          enum: [draft, active, completed]
        currentStageId:
          type: [integer, "null"]
        advisory:
          type: boolean
          const: true
        transitionPreview:
          $ref: "#/components/schemas/TournamentProgressionPreflight"
        progress:
          type: object
          required: [completed, total, inProgress, pending, postponed, cancelled, percent]
          properties:
            completed: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
            inProgress: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            postponed: { type: integer, minimum: 0 }
            cancelled: { type: integer, minimum: 0 }
            percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        recommendedAction:
          type: object
          required: [code, title, description, href, stageId, requiresConfirmation, availability]
          properties:
            code: { type: string }
            title: { type: string }
            description: { type: string }
            href: { type: string }
            stageId: { type: [integer, "null"] }
            requiresConfirmation: { type: boolean }
            availability:
              type: string
              enum: [ready, review, blocked]
        blockers:
          type: array
          items:
            type: object
            required: [code, message, stageId, severity]
            properties:
              code: { type: string }
              message: { type: string }
              stageId: { type: [integer, "null"] }
              severity:
                type: string
                enum: [blocking, warning]

    Bracket:
