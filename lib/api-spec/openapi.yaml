              stageBackupId: { type: integer }
              revision: { type: integer }
              round: { type: integer }
              matchNumber: { type: integer }
              player1BackupId: { type: ["integer", "null"] }
              player2BackupId: { type: ["integer", "null"] }
              winnerBackupId: { type: ["integer", "null"] }
              score1: { type: ["integer", "null"] }
              score2: { type: ["integer", "null"] }
