      properties:
        tournamentId: { type: integer }
        stageId: { type: integer }
        stageVersion: { type: integer }
        fingerprint: { type: string }
        ranking:
          type: array
          items: { $ref: "#/components/schemas/StageRankingEntry" }
        qualifiers:
          type: array
          items: { $ref: "#/components/schemas/StageQualifier" }

    TournamentUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        format:
          type: string
          enum: [single_elimination, round_robin, swiss]
        status:
          type: string
          enum: [draft, active, completed]
        maxPlayers:
          type: integer
        swissRounds:
          type: integer
        defaultBestOf:
          type: integer
          minimum: 1
        featuredMatchId:
          type: integer
        visibility:
          type: string
          enum: [public_online, private_online, private_offline]
        viewerPassword:
