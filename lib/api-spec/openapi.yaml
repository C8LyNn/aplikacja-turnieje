  # Pack 14: legacy one-step correction removed; use correction-intents.

  /tournaments/{id}/operations/correction-intents:
    post:
      operationId: prepareControlledCorrectionIntent
      tags: [tournaments]
      summary: Persist organizer approval for guarded Round Robin revert (does not mutate match)
      parameters:
        - $ref: "#/components/parameters/TournamentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operationId, matchId, expectedRevision, expectedCompletionActionId, expectedStageVersionVector, proposedScore1, proposedScore2, approvedByOrganizer, understandsRequiresResubmission]
              properties:
                operationId: { type: string, format: uuid }
                matchId: { type: integer, minimum: 1 }
                expectedRevision: { type: integer, minimum: 1 }
                expectedCompletionActionId: { type: integer, minimum: 1 }
                expectedStageVersionVector: { type: string, minLength: 2, maxLength: 80000 }
                proposedScore1: { type: integer, minimum: 0 }
                proposedScore2: { type: integer, minimum: 0 }
                approvedByOrganizer: { type: boolean, const: true }
                understandsRequiresResubmission: { type: boolean, const: true }
      responses:
        "201":
          description: New durable approval (match unchanged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionIntentReceipt" }
        "200":
          description: Idempotent receipt for identical operation id and request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionIntentReceipt" }
        "409": { description: Stale preview or operation id collision }
        "403": { description: Organizer session required }

  /tournaments/{id}/operations/correction-intents/{operationId}:
    get:
      operationId: getControlledCorrectionIntent
      tags: [tournaments]
      summary: Recover the durable approval/execution receipt after connection loss
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Status of immutable correction operation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionIntentReceipt" }
        "403": { description: Organizer session required }
        "404": { description: Unknown operation }

  /tournaments/{id}/operations/correction-intents/{operationId}/execute:
    post:
      operationId: executeControlledCorrectionIntent
      tags: [tournaments]
      summary: Execute the approved, single-match revert with transactional receipt
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revert committed, or idempotent receipt of a previous completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionIntentReceipt" }
        "403": { description: Organizer session required }
        "409": { description: Expired approval or changed tournament state }
        "422": { description: Existing revertMatch safety rules prevented the action }

  /tournaments/{id}/operations/correction-intents/{operationId}/execute-atomic:
    post:
      operationId: executeAtomicCorrectionIntent
      tags: [tournaments]
      summary: Atomically revert and replace an approved Round Robin result in one transaction
      parameters:
        - $ref: "#/components/parameters/TournamentId"
        - name: operationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Corrected match or repeatable receipt after connection loss
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectionIntentReceipt" }
        "403": { description: Organizer session required }
        "404": { description: Unknown correction approval }
        "409": { description: "Expired or stale approval, concurrent conflict or invalid score" }

  /tournaments/{id}/matches/{matchId}/se-correction-readiness:
    post:
      operationId: assessSingleEliminationCorrectionReadiness
      tags: [tournaments]
      summary: Snapshot-consistent, read-only SE correction readiness; never permits execution
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: matchId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [score1, score2, expectedMatchRevision, expectedStageVersionVector, expectedCompletionActionId]
              properties:
                score1: { type: integer, minimum: 0, maximum: 999999 }
                score2: { type: integer, minimum: 0, maximum: 999999 }
                expectedMatchRevision: { type: integer, minimum: 1 }
                expectedStageVersionVector: { type: string, minLength: 2, maxLength: 80000 }
                expectedCompletionActionId: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Non-authorizing, read-only readiness analysis
          content:
            application/json:
              schema:
                type: object
                required: [version, status, advisoryOnly, executionEnabled, writePerformed, matchId, issues]
                properties:
                  version: { type: integer, enum: [1] }
                  status: { type: string, enum: [candidate, blocked] }
                  advisoryOnly: { type: boolean, const: true }
                  executionEnabled: { type: boolean, const: false }
                  writePerformed: { type: boolean, const: false }
                  matchId: { type: integer }
                  expectedMatchRevision: { type: integer }
                  stageVersionVector: { type: string }
                  originalWinnerId: { type: [integer, "null"] }
                  hypotheticalWinnerId: { type: [integer, "null"] }
                  dependentMatch: { type: [object, "null"] }
                  requiredChecks: { type: array, items: { type: string } }
                  issues: { type: array, items: { type: string } }
                  reason: { type: string }
                  impactRiskReport:
                    type: object
                    description: Conservative advisory risk report derived from bounded SE graph; not an execution approval.
                    required: [version, kind, advisoryOnly, executionEnabled, writePerformed, matchId, status, highestSeverity, items, note]
                    properties:
                      version: { type: integer, enum: [1] }
                      kind: { type: string, enum: [se_correction_impact_risk_report] }
                      advisoryOnly: { type: boolean, const: true }
                      executionEnabled: { type: boolean, const: false }
                      writePerformed: { type: boolean, const: false }
                      matchId: { type: integer }
                      status: { type: string, enum: [incomplete, requires_review, observational] }
                      highestSeverity: { type: string, enum: [critical, high, medium, low] }
                      items: { type: array, items: { type: object } }
                      note: { type: string }
                  impactGraph:
                    type: object
                    description: Bounded, advisory-only forward SE impact graph from the same read-only snapshot. Future winners and cross-stage routing are NOT predicted.
                    required: [version, kind, advisoryOnly, executionEnabled, writePerformed, status, matchId, stageId, changeType, downstreamMatches, laterStages, directSuccessorCount, potentialLaterMatchCount, startedDownstreamCount, warnings, note]
                    properties:
                      version: { type: integer, enum: [1] }
                      kind: { type: string, enum: [se_correction_impact_graph] }
                      advisoryOnly: { type: boolean, const: true }
                      executionEnabled: { type: boolean, const: false }
                      writePerformed: { type: boolean, const: false }
                      status: { type: string, enum: [outlined, review_required, incomplete] }
                      matchId: { type: integer }
                      stageId: { type: [integer, "null"] }
                      changeType: { type: string, enum: [winner_change, score_only, unknown] }
                      sourceRound: { type: [integer, "null"] }
                      downstreamMatches: { type: array, items: { type: object } }
                      laterStages: { type: array, items: { type: object } }
                      directSuccessorCount: { type: integer, minimum: 0 }
                      potentialLaterMatchCount: { type: integer, minimum: 0 }
                      startedDownstreamCount: { type: integer, minimum: 0 }
                      warnings: { type: array, items: { type: string } }
                      note: { type: string }
                  diagnostic:
                    type: object
                    description: Human readable SE blockers and deterministic, snapshot-only correlation identifier; NOT execution permission.
                    required: [version, kind, advisoryOnly, executionEnabled, writePerformed, status, assessmentId, validity, matchId, expectedMatchRevision, issueCount, priorityCategory, blockers, recommendedNextActions, note]
                    properties:
                      version: { type: integer, enum: [1] }
                      kind: { type: string, enum: [se_correction_diagnostic] }
                      advisoryOnly: { type: boolean, const: true }
                      executionEnabled: { type: boolean, const: false }
                      writePerformed: { type: boolean, const: false }
                      status: { type: string, enum: [candidate, blocked] }
                      assessmentId: { type: string, pattern: '^[a-f0-9]{64}$' }
                      validity: { type: string, enum: [snapshot_only] }
                      matchId: { type: integer }
                      expectedMatchRevision: { type: integer }
                      issueCount: { type: integer, minimum: 0 }
                      priorityCategory: { type: [string, "null"] }
                      blockers: { type: array, items: { type: object } }
                      recommendedNextActions: { type: array, items: { type: string } }
                      note: { type: string }
                  actionPlan:
                    type: object
                    description: Advisory hypothetical SE recovery plan. NEVER authorization to execute.
                    required: [version, kind, advisoryOnly, executionEnabled, writePerformed, state, changeType, matchId, evidence, score, winner, successor, steps, blockerCodes, note]
                    properties:
                      version: { type: integer, enum: [1] }
                      kind: { type: string, enum: [se_correction_advisory_plan] }
                      advisoryOnly: { type: boolean, const: true }
                      executionEnabled: { type: boolean, const: false }
                      writePerformed: { type: boolean, const: false }
                      state: { type: string, enum: [candidate, blocked] }
                      changeType: { type: string, enum: [winner_change, score_only, unknown] }
                      matchId: { type: integer }
                      evidence: { type: object }
                      score: { type: object }
                      winner: { type: object }
                      successor: { type: [object, "null"] }
                      steps: { type: array, items: { type: object } }
                      blockerCodes: { type: array, items: { type: string } }
                      note: { type: string }
        "400": { description: Invalid expected values or scores }
        "403": { description: Organizer required }
        "404": { description: Tournament or match not found }

  /tournaments/{id}/matches/{matchId}/se-correction-preflight:
    get:
      operationId: getSingleEliminationCorrectionSafety
      tags: [tournaments]
      summary: Read-only Single Elimination correction structural safety (not permission to execute)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: matchId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: score1
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
        - name: score2
          in: query
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Advisory structural safety assessment. Never authorizes a mutation.
          content:
            application/json:
              schema:
                type: object
                required: [version, status, advisoryOnly, executionEnabled, matchId, issues]
                properties:
                  version: { type: integer, enum: [1] }
                  status: { type: string, enum: [structurally_safe, blocked] }
                  advisoryOnly: { type: boolean, enum: [true] }
                  executionEnabled: { type: boolean, enum: [false] }
                  matchId: { type: integer }
                  priorWinnerId: { type: [integer, "null"] }
                  proposedWinnerId: { type: [integer, "null"] }
                  winnerChanges: { type: boolean }
                  readVersion: { type: string }
                  issues:
                    type: array
                    items: { type: string }
                  dependentMatch:
                    type: [object, "null"]
                  message: { type: string }
        "400": { description: Invalid match identifier or proposed scores }
        "403": { description: Organizer permission required }
        "404": { description: Match or tournament not found }
        "409": { description: State changed during read or stage does not exist }

  /tournaments/{id}/assistant:
    get:
      operationId: getTournamentAssistant
      tags: [tournaments]
      summary: Get tournament assistant snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assistant snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSnapshot"

  /tournaments/{id}/players:
    get:
      operationId: listPlayers
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: addPlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /tournaments/{id}/players/import:
    post:
      operationId: importPlayers
      tags: [players]
      summary: Import players from CSV text
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsvImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsvImportResult"

  /players/{id}:
    patch:
      operationId: updatePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
    delete:
      operationId: deletePlayer
      tags: [players]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tournaments/{id}/matches:
    get:
      operationId: listMatches
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    patch:
      operationId: updateMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/complete:
    post:
      operationId: completeMatch
      tags: [matches]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchResult"
      responses:
        "200":
          description: Match completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "409":
          description: Match was already finalized or changed concurrently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Result payload or current tournament state violates series_v1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /matches/{id}/cancel:
    post:
      operationId: cancelMatch
      tags: [matches]
      summary: Cancel a match (saves state for undo)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchCancelInput"
      responses:
        "200":
          description: Match cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "409":
          description: Concurrent modification or duplicate cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Match is completed, stage is inactive, or payload violates cancel policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /matches/{id}/restore-cancelled:
    post:
      operationId: restoreCancelledMatch
      tags: [matches]
      summary: Restore a cancelled match back to pending
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRestoreCancelledInput"
      responses:
        "200":
          description: Match restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "409":
          description: Stale match revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Match is not cancelled, stage inactive or invalid result state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

  /matches/{id}/swap-players:
    post:
      operationId: swapMatchPlayers
      tags: [matches]
      summary: Swap player1 and player2 in a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Players swapped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Not found
        "400":
          description: Cannot swap players in current state

  /tournaments/{id}/reorder-matches:
    post:
      operationId: reorderMatches
      tags: [matches]
      summary: Reorder upcoming matches in the queue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderMatchesInput"
      responses:
        "200":
          description: Matches reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"

  /matches/{id}/revert:
    post:
      operationId: revertMatch
      tags: [matches]
      summary: Revert a completed match result
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match reverted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "404":
          description: Match, tournament, or participant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "409":
          description: Match is not completed, was already reverted, or downstream blocks the revert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"
        "422":
          description: Stored result, participants, history, or finalization is inconsistent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainError"

components:
  parameters:
    TournamentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    QualificationProposalEntry:
      type: object
      required: [basketId, playerId, placementRank, basketPosition]
      properties:
        basketId:
          type: string
        playerId:
          type: integer
        placementRank:
          type: integer
        basketPosition:
          type: integer
    QualificationProposal:
      type: object
      required: [proposalId, tournamentId, stageId, revision, status, rankingFingerprint, createdAt, entries]
      properties:
        proposalId:
          type: integer
        tournamentId:
          type: integer
        stageId:
          type: integer
        revision:
          type: integer
        status:
          type: string
          enum: [pending, approved]
        rankingFingerprint:
          type: string
          description: SHA-256 hex over sorted stage members + match results; stale when it changes after generate.
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        approvedByActorType:
          type: string
          nullable: true
        approvedByActorNick:
          type: string
          nullable: true
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QualificationProposalEntry"
    QualificationOutputEntry:
      type: object
      required: [playerId, basketId, finalRank, proposalId]
      properties:
        playerId:
          type: integer
        basketId:
          type: string
        finalRank:
          type: integer
        proposalId:
          type: integer
    QualificationOutput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/QualificationOutputEntry"
    DomainError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    SimpleError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    OrganizerPasswordTooShortError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          const: ORGANIZER_PASSWORD_TOO_SHORT
    OrganizerPasswordAlreadySetError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          const: ORGANIZER_PASSWORD_ALREADY_SET
    InvalidTournamentIdError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          const: INVALID_TOURNAMENT_ID
    CreateTournamentRuleError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - HOST_CODE_LEGACY_ONLY
            - STAGE_FORMAT_NOT_SUPPORTED
            - VIEWER_PASSWORD_REQUIRED
            - INVALID_DEFAULT_BEST_OF
    CreateTournamentBadRequestError:
      oneOf:
        - $ref: "#/components/schemas/SimpleError"
        - $ref: "#/components/schemas/OrganizerPasswordTooShortError"
        - $ref: "#/components/schemas/TournamentGameConfigError"
    CreateTournamentUnprocessableError:
      oneOf:
        - $ref: "#/components/schemas/CreateTournamentRuleError"
        - $ref: "#/components/schemas/StagePlanError"
    TournamentGameConfigError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [UNKNOWN_GAME_ID, UNSUPPORTED_GAME_CONFIG_VERSION, INVALID_GAME_CONFIG]
    GameConfigImmutableError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, const: GAME_CONFIG_IMMUTABLE }
    SetInitialOrganizerPasswordBadRequestError:
      oneOf:
        - $ref: "#/components/schemas/InvalidTournamentIdError"
        - $ref: "#/components/schemas/OrganizerPasswordTooShortError"
    StageBasketProblemCode:
      type: string
      enum:
        - STAGE_BASKET_STAGE_NOT_FOUND
        - STAGE_BASKET_ID_INVALID
        - STAGE_BASKET_ID_DUPLICATE
        - STAGE_INPUT_BASKET_COUNT_INVALID
        - STAGE_OUTPUT_BASKET_COUNT_INVALID
        - STAGE_BASKET_ORDINAL_DUPLICATE
        - STAGE_BASKET_ORDINAL_INVALID
        - STAGE_BASKET_ORDER_DUPLICATE
        - STAGE_BASKET_ORDER_INVALID
        - STAGE_BASKET_COLOR_ID_INVALID
        - STAGE_BASKET_PARTICIPANT_NOT_FOUND
        - STAGE_OUTPUT_BASKET_PARTICIPANTS_NOT_ALLOWED
        - STAGE_BASKET_PARTICIPANT_DUPLICATE
        - STAGE_BASKET_ROUTE_ID_INVALID
        - STAGE_BASKET_ROUTE_ID_DUPLICATE
        - STAGE_BASKET_ROUTE_SOURCE_NOT_FOUND
        - STAGE_BASKET_ROUTE_TARGET_NOT_FOUND
        - STAGE_BASKET_ROUTE_SOURCE_NOT_OUTPUT
        - STAGE_BASKET_ROUTE_TARGET_NOT_INPUT
        - STAGE_BASKET_ROUTE_OUTPUT_REUSED
        - STAGE_BASKET_ROUTE_NOT_FORWARD
        - STAGE_BASKET_ROUTE_CYCLE
        - STAGE_INPUT_BASKET_QUALIFIER_COUNT_NOT_ALLOWED
        - STAGE_OUTPUT_BASKET_QUALIFIER_COUNT_REQUIRED
        - STAGE_OUTPUT_BASKET_QUALIFIER_COUNT_INVALID
        - STAGE_OUTPUT_BASKET_QUOTA_EXCEEDS_PARTICIPANT_COUNT
        - STAGE_DERIVED_PARTICIPANT_COUNT_INVALID
    StageBasketProblemContext:
      type: object
      additionalProperties: false
      properties:
        stageId: { type: integer }
        basketId: { type: string }
        routeId: { type: string }
        participantId: { type: integer }
        sourceStageId: { type: integer }
        targetStageId: { type: integer }
    StageBasketProblem:
      type: object
      additionalProperties: false
      required: [code, message, context]
      properties:
        code: { $ref: "#/components/schemas/StageBasketProblemCode" }
        message: { type: string }
        context: { $ref: "#/components/schemas/StageBasketProblemContext" }
    StageBasketValidation:
      type: object
      additionalProperties: false
      required: [valid, problems]
      properties:
        valid: { type: boolean }
        problems:
          type: array
          items: { $ref: "#/components/schemas/StageBasketProblem" }
    StageBasket:
      type: object
      additionalProperties: false
      required: [id, stageId, type, ordinal, order, colorId, participantIds, qualifierCount]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._:-]{0,99}$"
        stageId: { type: integer, minimum: 1 }
        type: { type: string, enum: [input, output] }
        ordinal: { type: integer, minimum: 1, maximum: 4 }
        order: { type: integer, minimum: 1, maximum: 4 }
        colorId: { type: ["string", "null"], minLength: 1, maxLength: 64 }
        participantIds:
          type: array
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        qualifierCount:
          type: ["integer", "null"]
          minimum: 1
          description: >
            Exact number of ranked participants this output basket captures after stage execution.
            Null for input baskets (always) and for implicit legacy output baskets.
            Positive integer for organizer-configured explicit output baskets.
    StageBasketRoute:
      type: object
      additionalProperties: false
      required: [id, sourceBasketId, targetBasketId]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._:-]{0,99}$"
        sourceBasketId: { type: string }
        targetBasketId: { type: string }
    StageBasketConfigurationInput:
      type: object
      additionalProperties: false
      required: [baskets, routes]
      properties:
        baskets:
          type: array
          items: { $ref: "#/components/schemas/StageBasket" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/StageBasketRoute" }
    StageBasketConfiguration:
      type: object
      additionalProperties: false
      required: [tournamentId, legacyDefaulted, flowAuthority, baskets, routes, validation]
      properties:
        tournamentId: { type: integer }
        legacyDefaulted: { type: boolean }
        flowAuthority:
          type: string
          enum: [legacy, basket_v1]
          description: Persisted participant-flow authority. Stored pre-Phase-3.5 basket graphs remain legacy.
        baskets:
          type: array
          items: { $ref: "#/components/schemas/StageBasket" }
        routes:
          type: array
          items: { $ref: "#/components/schemas/StageBasketRoute" }
        validation: { $ref: "#/components/schemas/StageBasketValidation" }
    StageBasketConfigurationError:
      type: object
      additionalProperties: false
      required: [error, code, problems]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - TOURNAMENT_NOT_FOUND
            - STAGE_BASKET_CONFIGURATION_IMMUTABLE
            - STAGE_BASKET_CONFIGURATION_INVALID
            - STAGE_BASKET_ID_REASSIGNED
        problems:
          type: array
          items: { $ref: "#/components/schemas/StageBasketProblem" }
    StageLifecycleError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - TOURNAMENT_NOT_FOUND
            - STAGE_NOT_FOUND
            - STAGE_NOT_ACTIVE
            - STAGE_NOT_NEXT_PLANNED
            - ACTIVE_STAGE_EXISTS
            - PREVIOUS_STAGE_NOT_COMPLETED
            - STAGE_INCOMPLETE
            - STAGE_PARTICIPANTS_INCONSISTENT
            - STAGE_BASKET_CONFIGURATION_INVALID
            - QUALIFICATION_CONFIGURATION_INVALID
            - STAGE_FORMAT_NOT_SUPPORTED
            - STAGE_ALREADY_COMPLETED
            - STAGE_ALREADY_STARTED
            - MATCHES_ALREADY_EXIST
            - GROUPS_ALREADY_EXIST
            - RANKING_INCONSISTENT
    StageStartReadiness:
      type: object
      required: [ready, reasonCode, message, participantCount, requiredParticipantCount, missingSeeds, blockingMatches, blockingGroups, format, basketValidation]
      properties:
        ready: { type: boolean }
        reasonCode:
          type: string
          enum:
            - READY
            - TOURNAMENT_NOT_FOUND
            - STAGE_NOT_FOUND
            - STAGE_NOT_ACTIVE
            - STAGE_NOT_NEXT_PLANNED
            - ACTIVE_STAGE_EXISTS
            - PREVIOUS_STAGE_NOT_COMPLETED
            - STAGE_INCOMPLETE
            - STAGE_PARTICIPANTS_INCONSISTENT
            - STAGE_BASKET_CONFIGURATION_INVALID
            - QUALIFICATION_CONFIGURATION_INVALID
            - STAGE_FORMAT_NOT_SUPPORTED
            - STAGE_ALREADY_COMPLETED
            - STAGE_ALREADY_STARTED
            - MATCHES_ALREADY_EXIST
            - GROUPS_ALREADY_EXIST
            - RANKING_INCONSISTENT
            - STAGE_SEEDING_CONFIGURATION_INVALID
            - SEEDING_CEREMONY_REQUIRED
            - SEEDING_CEREMONY_INCOMPLETE
            - SEEDING_CEREMONY_STALE
        message: { type: string }
        participantCount: { type: integer, minimum: 0 }
        requiredParticipantCount: { type: integer, minimum: 0 }
        missingSeeds:
          type: array
          items: { type: integer, minimum: 1 }
        blockingMatches: { type: integer, minimum: 0 }
        blockingGroups: { type: integer, minimum: 0 }
        format:
          type: string
          enum: [swiss, round_robin, group_stage, single_elimination, double_elimination]
        basketValidation:
          $ref: "#/components/schemas/StageBasketValidation"
    SeedingCeremonyError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - TOURNAMENT_NOT_FOUND
            - STAGE_NOT_FOUND
            - STAGE_NOT_PLANNED
            - SEEDING_CEREMONY_NOT_AVAILABLE
            - SEEDING_CEREMONY_NOT_PREPARED
            - SEEDING_CEREMONY_ALREADY_COMPLETE
            - SEEDING_CEREMONY_STALE
            - STAGE_PARTICIPANTS_INCONSISTENT
            - MATCHES_ALREADY_EXIST
            - GROUPS_ALREADY_EXIST

    SeedingCeremonyGroupPlacement:
      type: object
      required: [kind, label, groupIndex, groupKey, groupPosition]
      properties:
        kind: { type: string, const: group }
        label: { type: string }
        groupIndex: { type: integer }
        groupKey: { type: string }
        groupPosition: { type: integer }

    SeedingCeremonyBracketPlacement:
      type: object
      required: [kind, label, bracketSlot, matchNumber, side, bye]
      properties:
        kind: { type: string, const: bracket }
        label: { type: string }
        bracketSlot: { type: integer }
        matchNumber: { type: integer }
        side:
          type: string
          enum: [player1, player2]
        bye: { type: boolean }

    SeedingCeremonyStandingsPlacement:
      type: object
      required: [kind, label, position]
      properties:
        kind: { type: string, const: standings }
        label: { type: string }
        position: { type: integer }

    SeedingCeremonyPlacement:
      oneOf:
        - $ref: "#/components/schemas/SeedingCeremonyGroupPlacement"
        - $ref: "#/components/schemas/SeedingCeremonyBracketPlacement"
        - $ref: "#/components/schemas/SeedingCeremonyStandingsPlacement"
      discriminator:
        propertyName: kind

    SeedingCeremonyDraw:
      type: object
      required: [drawNumber, participantKey, playerId, playerName, seed, placement]
      properties:
        drawNumber: { type: integer, minimum: 1 }
        participantKey: { type: string }
        playerId: { type: integer }
        playerName: { type: string }
        seed: { type: integer, minimum: 1 }
        placement:
          $ref: "#/components/schemas/SeedingCeremonyPlacement"

    SeedingCeremony:
      type: object
      required: [kind, version, stageId, status, drawMode, entrySeedingPolicy, placementPolicy, resultSeedingPolicy, revealOrder, randomSeed, participantSignature, configurationSignature, participantOrder, draws, revealedCount, preparedAt, updatedAt]
      properties:
        kind: { type: string, const: seeding_ceremony_v1 }
        version: { type: integer, const: 1 }
        stageId: { type: integer }
        status:
          type: string
          enum: [prepared, in_progress, completed, applied]
        drawMode:
          type: string
          enum: [seed, placement]
        entrySeedingPolicy: { type: string }
        placementPolicy: { type: string }
        resultSeedingPolicy: { type: string }
        revealOrder:
          type: string
          enum: [instant, sequential]
        randomSeed: { type: string }
        placementRandomSeed: { type: [string, "null"] }
        participantSignature: { type: string }
        configurationSignature: { type: string }
        participantOrder:
          type: array
          items: { type: string }
        draws:
          type: array
          items: { $ref: "#/components/schemas/SeedingCeremonyDraw" }
        revealedCount: { type: integer, minimum: 0 }
        preparedAt: { type: string }
        updatedAt: { type: string }
        completedAt: { type: [string, "null"] }
        appliedAt: { type: [string, "null"] }

    SeedingCeremonyResponse:
      type: object
      required: [ceremony]
      properties:
        ceremony:
          oneOf:
            - $ref: "#/components/schemas/SeedingCeremony"
            - type: "null"

    StagePlanError:
      type: object
      required: [error, code, details]
      properties:
        error: { type: string }
        code: { type: string, const: INVALID_STAGE_PLAN }
        details:
          type: array
          items:
            type: object
            required: [code, path, message]
            properties:
              code: { type: string }
              path: { type: string }
              message: { type: string }
    BackupImportError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [LEGACY_BACKUP_UNSUPPORTED, INVALID_BACKUP, INVALID_BACKUP_V2, INVALID_BACKUP_V3, BACKUP_VERSION_UNSUPPORTED, BACKUP_IMPORT_ROLLED_BACK, ORGANIZER_PASSWORD_REQUIRED, VIEWER_PASSWORD_REQUIRED]
        details:
          type: array
          items: { type: string }
        missingFields:
          type: array
          items:
            type: string
            enum: [organizerPassword, viewerPassword]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [ok, unavailable]
      required: [status, database]

    DeadlockTournamentConfigV1:
      type: object
      additionalProperties: false
      properties:
        forcedHeroId:
          type: string
          enum: [abrams, wraith, shiv, silver, drifter, the_doorman, sinclair, grey_talon, mo_and_krill, yamato, holliday, warden, mina, paradox, mcginnis, dynamo, infernus, haze, mirage, rem, paige, ivy, venator, vindicta, viscous, lash, vyper, kelvin, calico, victor, graves, bebop, pocket, seven, billy, lady_geist, apollo, celeste]
        banMode:
          type: string
          enum: [shared_pool, opponent_only]
        bansPerPlayer:
          type: integer
          minimum: 0
          maximum: 20
        stageBans:
          type: array
          maxItems: 10
          description: Additional global hero bans introduced by each stage. Effective bans are cumulative in stage order.
          items:
            type: object
            additionalProperties: false
            required: [stageKey, bannedHeroIds]
            properties:
              stageKey: { type: string, minLength: 1 }
              bannedHeroIds:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum: [abrams, wraith, shiv, silver, drifter, the_doorman, sinclair, grey_talon, mo_and_krill, yamato, holliday, warden, mina, paradox, mcginnis, dynamo, infernus, haze, mirage, rem, paige, ivy, venator, vindicta, viscous, lash, vyper, kelvin, calico, victor, graves, bebop, pocket, seven, billy, lady_geist, apollo, celeste]
    DeadlockTournamentGameConfig:
      type: object
      additionalProperties: false
      required: [gameId, configVersion, config]
      properties:
        gameId: { type: string, const: deadlock }
        configVersion: { type: integer, const: 1 }
        config:
          $ref: "#/components/schemas/DeadlockTournamentConfigV1"

    MarvelRegroupingStrategy:
      type: string
      enum: [paired_merge, random, manual]

    MarvelTournamentConfigV1:
      type: object
      additionalProperties: false
      required: [groupSize, advancingCount, killLimit, regroupingStrategy]
      properties:
        groupSize: { type: integer, minimum: 2, maximum: 128, default: 8 }
        advancingCount: { type: integer, minimum: 1, default: 4 }
        killLimit: { type: integer, minimum: 1, default: 20 }
        regroupingStrategy:
          allOf:
            - $ref: "#/components/schemas/MarvelRegroupingStrategy"
          default: paired_merge

    MarvelTournamentGameConfig:
      type: object
      additionalProperties: false
      required: [gameId, configVersion, config]
      properties:
        gameId: { type: string, const: marvel }
        configVersion: { type: integer, const: 1 }
        config:
          $ref: "#/components/schemas/MarvelTournamentConfigV1"

    Tournament:
      type: object
      required: [id, name, format, status, resultModelVersion, rankingPolicy, defaultBestOf, createdAt, hasHostCode]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        format:
          type: string
          enum: [single_elimination, round_robin, swiss, group_stage, double_elimination]
        status:
          type: string
          enum: [draft, active, completed]
        maxPlayers:
          type: ["integer", "null"]
        swissRounds:
          type: ["integer", "null"]
        resultModelVersion:
          type: string
          enum: [series_v1]
        rankingPolicy:
          type: string
          enum: [match_record_v1]
        defaultBestOf:
          type: integer
          minimum: 1
        currentRound:
          type: ["integer", "null"]
        totalRounds:
          type: ["integer", "null"]
        winnerId:
          type: ["integer", "null"]
        featuredMatchId:
          type: ["integer", "null"]
        activeStageId:
          type: ["integer", "null"]
        hasHostCode:
          type: boolean
          description: Whether a host access code has been set for this tournament
        hasOrganizerPassword:
          type: boolean
          description: Whether an organizer password has been set
        hasSupportPassword:
          type: boolean
          description: Whether a support password has been set
        hasViewerPassword:
          type: boolean
          description: Whether a viewer password has been set (private_online mode)
        visibility:
          type: string
          enum: [public_online, private_online, private_offline]
          description: "public_online=no viewer password; private_online=viewer needs password; private_offline=not listed, org/support only"
        createdAt:
          type: string
        gameConfig:
          oneOf:
            - $ref: "#/components/schemas/DeadlockTournamentGameConfig"
            - $ref: "#/components/schemas/MarvelTournamentGameConfig"
            - type: "null"
        presentationSettings:
          oneOf:
            - $ref: "#/components/schemas/TournamentPresentationSettings"
            - type: "null"

    TournamentTemplateRequest:
      type: object
      additionalProperties: false
      required: [templateId, participantCount, bestOf]
      properties:
        templateId:
          type: string
          enum: [quick_elimination, double_chance, everyone_plays, swiss, groups_to_playoffs, swiss_to_playoffs]
        participantCount: { type: integer, minimum: 2, maximum: 128 }
        bestOf: { type: integer, enum: [1, 3, 5, 7] }

    TournamentTemplateFailure:
      type: object
      required: [code, error]
      properties:
        code: { type: string }
        error: { type: string }

    TournamentTemplatePreview:
      type: object
      required: [version, templateId, label, stagePlan, stages, estimatedTotalMatches, estimatedMatchesMaximum, warnings, advisory, requiresConfirmation]
      properties:
        version: { type: integer, enum: [1] }
        templateId: { type: string, enum: [quick_elimination, double_chance, everyone_plays, swiss, groups_to_playoffs, swiss_to_playoffs] }
        label: { type: string }
        stagePlan: { $ref: "#/components/schemas/TournamentStagePlanInput" }
        stages:
          type: array
          items:
            type: object
            required: [position, name, format, participantCount, advancingCount, estimatedMatches]
            properties:
              position: { type: integer }
              name: { type: string }
              format: { type: string }
              participantCount: { type: integer }
              advancingCount: { type: [integer, "null"] }
              estimatedMatches: { type: integer }
        estimatedTotalMatches: { type: integer, minimum: 0 }
        estimatedMatchesMaximum: { type: integer, minimum: 0 }
        warnings:
          type: array
          items: { type: string }
        advisory: { type: boolean, const: true }
        requiresConfirmation: { type: boolean, const: true }

    TournamentInput:
      type: object
      required: [name, format, organizerPassword]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        format:
          type: string
          enum: [single_elimination, round_robin, swiss, group_stage, double_elimination]
        maxPlayers:
          type: integer
        swissRounds:
          type: integer
        defaultBestOf:
          type: integer
          minimum: 1
        organizerPassword:
          type: string
          minLength: 8
          description: Required organizer password. Keep it to sign in again after losing a session or on another device. Only its hash is stored; the password cannot be displayed again.
        supportPassword:
          type: string
          minLength: 8
          description: Optional password for support staff access
        viewerPassword:
          type: string
          minLength: 8
          description: Password for viewer access; required when visibility=private_online.
        visibility:
          type: string
          enum: [public_online, private_online, private_offline]
          description: Tournament visibility mode
        stagePlan:
          $ref: "#/components/schemas/TournamentStagePlanInput"
          description: Optional authoritative 1-10 stage plan. The legacy format fields remain a compatibility projection.
        gameConfig:
          oneOf:
            - $ref: "#/components/schemas/DeadlockTournamentGameConfig"
            - $ref: "#/components/schemas/MarvelTournamentGameConfig"

    TournamentCreationResponse:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          required: [organizerToken]
          properties:
            organizerToken:
              type: string
              description: Tournament-scoped organizer session issued only to the creator.

    TournamentStagePlanInput:
      type: object
      additionalProperties: false
      required: [initialParticipantCount, stages]
      properties:
        initialParticipantCount:
          type: integer
          minimum: 2
        stages:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/TournamentStagePlanItemInput"

    TournamentStagePlanItemInput:
      type: object
      additionalProperties: false
      required: [key, position, name, format, participantCount, bestOf]
      properties:
        key:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 1
          maximum: 10
        name:
          type: string
          minLength: 1
        format:
          type: string
          enum: [swiss, round_robin, group_stage, single_elimination, double_elimination]
        participantCount:
          type: integer
          minimum: 2
        bestOf:
          type: integer
          enum: [1, 3, 5, 7]
        rounds:
          type: integer
          minimum: 1
        advancingCount:
          type: integer
          minimum: 2
          description: >-
            Required for every non-terminal Swiss, Round Robin, or Single Elimination stage.
            Must equal the next stage participantCount. For Single Elimination it must be a
            complete-round boundary of at least 2 (for example 16 participants may advance
            8, 4, or 2). A terminal Single Elimination stage omits this field and implicitly
            finishes with one champion.
        groupCount:
          type: integer
          minimum: 1
          description: Number of balanced groups. Must not exceed floor(participantCount / 2).
        participantsPerGroup:
          type: integer
          minimum: 2
          description: Derived largest group size, equal to ceil(participantCount / groupCount).
        qualifiersPerGroup:
          type: integer
          minimum: 1
          description: Maximum qualifiers taken from each group. Smaller groups may qualify everyone.
        entrySeedingMethod:
          type: string
          enum: [preserve, registration_order, alphabetical, random, manual]
          default: preserve
          description: How incoming participants are converted into stage seeds.
        placementMethod:
          type: string
          enum: [standings_order, snake, random, standard]
          description: Format-specific placement. Groups use snake/random; brackets use standard/random.
        resultSeedingMethod:
          type: string
          enum: [rank_bands, global_ranking]
          description: How group qualifiers receive new seeds.
        randomSeed:
          type: string
          minLength: 1
          maxLength: 200
          description: Deterministic key required by random seeding or placement.
        randomRevealOrder:
          type: string
          enum: [instant, sequential]
          default: instant
        seedingMethod:
          type: string
          enum: [snake, random]
          deprecated: true
          description: Compatibility alias for group placementMethod.

    TournamentStage:
      type: object
      required: [id, tournamentId, stageKey, position, name, format, status, participantCount, bestOf, rankingPolicy, qualificationMode, seedingPolicy, entrySeedingPolicy, resultSeedingPolicy, randomRevealOrder, version, createdAt]
      properties:
        id: { type: integer }
        tournamentId: { type: integer }
        stageKey: { type: string }
        position: { type: integer }
        name: { type: string }
        format:
          type: string
          enum: [swiss, round_robin, group_stage, single_elimination, double_elimination]
        status:
          type: string
          enum: [planned, active, completed]
        participantCount: { type: integer }
        bestOf: { type: integer }
        plannedRounds: { type: ["integer", "null"] }
        currentRound: { type: ["integer", "null"] }
        totalRounds: { type: ["integer", "null"] }
        rankingPolicy:
          type: string
          enum: [swiss_v1, round_robin_v1, group_v1, elimination_bracket_v1]
        qualificationMode:
          type: string
          enum: [none, top_n, top_n_per_group]
        advancingCount: { type: ["integer", "null"] }
        groupCount: { type: ["integer", "null"] }
        participantsPerGroup: { type: ["integer", "null"] }
        qualifiersPerGroup: { type: ["integer", "null"] }
        seedingPolicy:
          type: string
          enum: [standings_order, snake_groups, cross_group, random_groups, standard_bracket, random_bracket]
        entrySeedingPolicy:
          type: string
          enum: [preserve, registration_order, alphabetical, random, manual]
        resultSeedingPolicy:
          type: string
          enum: [standings_order, rank_bands, global_ranking]
        randomSeed: { type: ["string", "null"] }
        randomRevealOrder:
          type: string
          enum: [instant, sequential]
        seedingAudit:
          type: ["object", "null"]
          additionalProperties: true
        winnerId: { type: ["integer", "null"] }
        version: { type: integer }
        createdAt: { type: string }
        startedAt: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"] }

    StageGroup:
      type: object
      required: [id, stageId, groupKey, position, participantCount, qualifiersCount, createdAt]
      properties:
        id: { type: integer }
        stageId: { type: integer }
        groupKey: { type: string, minLength: 1 }
        position: { type: integer }
        participantCount: { type: integer }
        qualifiersCount: { type: integer }
        createdAt: { type: string }

    StageParticipant:
      type: object
      required: [id, tournamentId, stageId, playerId, playerName, stageSeed, status, qualificationSource, createdAt]
      properties:
        id: { type: integer }
        tournamentId: { type: integer }
        stageId: { type: integer }
        playerId: { type: integer }
        playerName: { type: string }
        stageSeed: { type: integer }
        groupId: { type: ["integer", "null"] }
        groupKey: { type: ["string", "null"], minLength: 1 }
        status:
          type: string
          enum: [active, eliminated, qualified, winner]
        qualificationSource:
          type: string
          enum: [registration, standings, group_position]
        finalRank: { type: ["integer", "null"] }
        groupRank: { type: ["integer", "null"] }
        qualificationRank: { type: ["integer", "null"] }
        nextStageSeed: { type: ["integer", "null"] }
        sourceStageParticipantId: { type: ["integer", "null"] }
        qualifiedAt: { type: ["string", "null"] }
        createdAt: { type: string }

    TournamentStageDetails:
      type: object
      required: [stage, groups, participants, ranking, qualifiers]
      properties:
        stage:
          $ref: "#/components/schemas/TournamentStage"
        groups:
          type: array
          items: { $ref: "#/components/schemas/StageGroup" }
        participants:
          type: array
          items: { $ref: "#/components/schemas/StageParticipant" }
        ranking:
          type: array
          description: Frozen ranking rows. Empty until a stage has been completed.
          items: { $ref: "#/components/schemas/StageParticipant" }
        qualifiers:
          type: array
          items: { $ref: "#/components/schemas/StageParticipant" }

    MarvelEliminationStageError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum:
            - MARVEL_STAGE_NOT_FOUND
            - MARVEL_STAGE_NOT_ACTIVE
            - MARVEL_STAGE_CONFIGURATION_INVALID
            - MARVEL_GROUP_NOT_FOUND
            - MARVEL_GROUP_ALREADY_COMPLETED
            - MARVEL_GROUP_RESULT_INVALID
            - MARVEL_MANUAL_GROUPING_NOT_REQUIRED
            - MARVEL_MANUAL_GROUPING_INVALID

    MarvelGroupResultPlacementInput:
      type: object
      additionalProperties: false
      required: [playerId]
      properties:
        playerId: { type: integer, minimum: 1 }
        kills: { type: ["integer", "null"], minimum: 0 }

    MarvelGroupResultInput:
      type: object
      additionalProperties: false
      required: [placements]
      properties:
        placements:
          type: array
          minItems: 2
          items:
            { $ref: "#/components/schemas/MarvelGroupResultPlacementInput" }

    MarvelManualGroupInput:
      type: object
      additionalProperties: false
      required: [position, playerIds]
      properties:
        position: { type: integer, minimum: 1 }
        playerIds:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: integer, minimum: 1 }

    MarvelManualGroupsInput:
      type: object
      additionalProperties: false
      required: [groups]
      properties:
        groups:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/MarvelManualGroupInput" }

    MarvelEliminationGroupEntry:
      type: object
      additionalProperties: false
      required:
        [
          playerId,
          playerName,
          groupSlot,
          placement,
          kills,
          qualified,
          sourceGroupId,
          nextGroupId,
        ]
      properties:
        playerId: { type: integer }
        playerName: { type: string }
        groupSlot: { type: integer, minimum: 1 }
        placement: { type: ["integer", "null"], minimum: 1 }
        kills: { type: ["integer", "null"], minimum: 0 }
        qualified: { type: ["boolean", "null"] }
        sourceGroupId: { type: ["integer", "null"] }
        nextGroupId: { type: ["integer", "null"] }

    MarvelEliminationGroup:
      type: object
      additionalProperties: false
      required: [id, groupKey, position, status, completedAt, entries]
      properties:
        id: { type: integer }
        groupKey: { type: string }
        position: { type: integer, minimum: 1 }
        status: { type: string, enum: [pending, completed] }
        completedAt: { type: ["string", "null"], format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/MarvelEliminationGroupEntry" }

    MarvelEliminationRound:
      type: object
      additionalProperties: false
      required:
        [
          id,
          roundNumber,
          participantCount,
          status,
          randomSeed,
          completedAt,
          groups,
        ]
      properties:
        id: { type: integer }
        roundNumber: { type: integer, minimum: 1 }
        participantCount: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, awaiting_manual, completed] }
        randomSeed: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"], format: date-time }
        groups:
          type: array
          items: { $ref: "#/components/schemas/MarvelEliminationGroup" }

    MarvelEliminationStageState:
      type: object
      additionalProperties: false
      required:
        [
          tournamentId,
          stageId,
          status,
          currentRound,
          totalRounds,
          winnerId,
          config,
          rounds,
        ]
      properties:
        tournamentId: { type: integer }
        stageId: { type: integer }
        status: { type: string, enum: [planned, active, completed] }
        currentRound: { type: ["integer", "null"] }
        totalRounds: { type: ["integer", "null"] }
        winnerId: { type: ["integer", "null"] }
        config: { $ref: "#/components/schemas/MarvelTournamentConfigV1" }
        rounds:
          type: array
          items: { $ref: "#/components/schemas/MarvelEliminationRound" }

    DoubleEliminationParticipant:
      type: object
      additionalProperties: false
      required: [participantKey, playerId, name, seed, losses, status]
      properties:
        participantKey: { type: string }
        playerId: { type: integer }
        name: { type: string }
        seed: { type: integer }
        losses: { type: integer, minimum: 0, maximum: 2 }
        status:
          type: string
          enum: [active, eliminated, winner]

    DoubleEliminationMatch:
      type: object
      additionalProperties: false
      required: [matchKey, matchId, name, bracket, round, matchNumber, order, slots, status, bestOf, score1, score2, downstreamResultCount, winnerParticipantKey, loserParticipantKey]
      properties:
        matchKey: { type: string }
        matchId: { type: ["integer", "null"] }
        name: { type: string }
        bracket:
          type: string
          enum: [upper, lower, grand_final, grand_final_reset]
        round: { type: integer, minimum: 1 }
        matchNumber: { type: integer, minimum: 1 }
        order: { type: integer, minimum: 0 }
        slots:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: ["string", "null"] }
        status:
          type: string
          enum: [blocked, ready, completed, bye, skipped]
        bestOf: { type: ["integer", "null"] }
        score1: { type: ["integer", "null"] }
        score2: { type: ["integer", "null"] }
        downstreamResultCount: { type: integer, minimum: 0 }
        winnerParticipantKey: { type: ["string", "null"] }
        loserParticipantKey: { type: ["string", "null"] }

    DoubleEliminationStageState:
      type: object
      additionalProperties: false
      required: [tournamentId, stageId, revision, completed, championParticipantKey, participants, matches]
      properties:
        tournamentId: { type: integer }
        stageId: { type: integer }
        revision: { type: integer, minimum: 1 }
        completed: { type: boolean }
        championParticipantKey: { type: ["string", "null"] }
        participants:
          type: array
          items: { $ref: "#/components/schemas/DoubleEliminationParticipant" }
        matches:
          type: array
          items: { $ref: "#/components/schemas/DoubleEliminationMatch" }

    DoubleEliminationResetInput:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 1 }

    DoubleEliminationMutationReceipt:
      type: object
      additionalProperties: false
      required: [revision, invalidatedResultCount]
      properties:
        revision: { type: integer, minimum: 1 }
        invalidatedResultCount: { type: integer, minimum: 0 }

    DoubleEliminationError:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [TOURNAMENT_NOT_FOUND, STAGE_NOT_FOUND, DOUBLE_ELIMINATION_NOT_ACTIVE, DOUBLE_ELIMINATION_EXECUTION_NOT_FOUND, EXECUTION_REVISION_CONFLICT]

    StageRankingEntry:
      type: object
      required: [stageParticipantId, playerId, playerName, stageSeed, rank, matchWins, matchLosses, gameWins, gameLosses, gameDiff]
      properties:
        stageParticipantId: { type: integer }
        playerId: { type: integer }
        playerName: { type: string }
        stageSeed: { type: integer }
        rank: { type: integer }
        matchWins: { type: integer }
        matchLosses: { type: integer }
        gameWins: { type: integer }
        gameLosses: { type: integer }
        gameDiff: { type: integer }
        buchholz: { type: ["integer", "null"] }
        groupId: { type: ["integer", "null"] }
        groupKey: { type: ["string", "null"], minLength: 1 }
        groupRank: { type: ["integer", "null"] }

    StageQualifier:
      allOf:
        - $ref: "#/components/schemas/StageRankingEntry"
        - type: object
          required: [qualificationSource, nextStageSeed]
          properties:
            qualificationSource:
              type: string
              enum: [standings, group_position]
            nextStageSeed: { type: integer }

    StageQualificationPreview:
      type: object
